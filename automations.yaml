- id: git_snapshot_after_ui_changes
  alias: Git snapshot after UI changes
  triggers:
  - trigger: time_pattern
    minutes: "/30"
  conditions: []
  actions:
  - action: shell_command.git_snapshot
    response_variable: git_snapshot
  - if:
    - condition: template
      value_template: "{{ git_snapshot.returncode != 0 }}"
    then:
    - action: persistent_notification.create
      data:
        title: Git snapshot failed
        message: >-
          git-snapshot.sh failed with return code {{ git_snapshot.returncode }}.
          stderr: {{ git_snapshot.stderr | default('') }}
          stdout: {{ git_snapshot.stdout | default('') }}
  mode: single
- id: sonoff_snzb_02wd_humidity_offset_on_report
  alias: Sonoff SNZB-02WD Feuchte-Offset bei Sensor-Report schreiben
  description: Versucht den Geräte-Offset direkt nach einem neuen Messwert zu schreiben, wenn der Sensor kurz erreichbar sein könnte.
  triggers:
  - trigger: state
    entity_id:
    - sensor.sonoff_snzb_02wd_humidity
    - sensor.sonoff_snzb_02wd_temperature
  conditions:
  - condition: template
    value_template: >-
      {{
        trigger.to_state is not none
        and trigger.to_state.state not in ['unknown', 'unavailable']
        and (states('number.sonoff_snzb_02wd_humidity_offset') | float(999) - 4.5) | abs > 0.05
      }}
  actions:
  - action: number.set_value
    continue_on_error: true
    target:
      entity_id: number.sonoff_snzb_02wd_humidity_offset
    data:
      value: 4.5
  mode: single
- id: '1780071059264'
  alias: Garage TTK Entfeuchter an
  description: Schaltet den TTK 75 Eco bei hoher Garagenfeuchte ein, solange es warm genug ist.
  triggers:
  - type: humidity
    device_id: 93c766f0890f4945e595ada307cdd6be
    entity_id: 40beacf828453f91eabae791ad7f8989
    domain: sensor
    trigger: device
    above: 60
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    above: 5.5
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: time_pattern
    minutes: "/5"
  conditions:
  - condition: state
    entity_id: binary_sensor.garage_feuchte_ueber_60
    state: "on"
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - condition: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    above: 5.5
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.entfeuchter
    data: {}
  mode: single
- id: '1780071226885'
  alias: Garage TTK Entfeuchter aus
  description: Schaltet den TTK 75 Eco bei Ziel-Feuchte oder unter 5 Grad ab.
  triggers:
  - trigger: state
    entity_id: binary_sensor.garage_feuchte_unter_55
    to: "on"
  - trigger: state
    entity_id: binary_sensor.garage_temperatur_unter_5
    to: "on"
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: time_pattern
    minutes: "/5"
  conditions:
  - condition: state
    entity_id: switch.entfeuchter
    state: "on"
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.garage_feuchte_unter_55
      state: "on"
    - condition: state
      entity_id: binary_sensor.garage_temperatur_unter_5
      state: "on"
      for:
        hours: 0
        minutes: 5
        seconds: 0
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.entfeuchter
    data: {}
  mode: single
- id: garage_ttr_entfeuchter_boost_an
  alias: Garage TTR Entfeuchter Boost an
