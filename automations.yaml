- id: solar_heat_protection_blind_recommendation
  alias: Hitzeschutz Jalousie OG Automatik und Empfehlung
  description: Fährt tagsüber OG-Jalousien für solaren Wärmeschutz und meldet EG/KG nur als Empfehlung.
  triggers:
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_west
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: west_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_wohnzimmer_panorama
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: wohnzimmer_panorama_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_sonnensegel
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: sonnensegel_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_ost
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: ost_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_sud
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: sued_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_nord
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: nord_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_west
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: west_open
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_wohnzimmer_panorama
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: wohnzimmer_panorama_open
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_sonnensegel
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: sonnensegel_open
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_ost
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: ost_open
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_sud
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: sued_open
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_nord
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: nord_open
  variables:
    facade_key: "{{ trigger.id.rsplit('_', 1)[0] }}"
    action_id: "{{ trigger.id.rsplit('_', 1)[1] }}"
    facade_name: >-
      {% from 'heat_protection.jinja' import facade_name %}
      {% set facade_name = facade_name | as_function %}
      {{ facade_name(facade_key) }}
    facade_display_name: >-
      {% from 'heat_protection.jinja' import facade_display_name %}
      {% set facade_display_name = facade_display_name | as_function %}
      {{ facade_display_name(facade_key) }}
    cover_entities: >-
      {% from 'heat_protection.jinja' import facade_covers %}
      {% set facade_covers = facade_covers | as_function %}
      {{ facade_covers(facade_key) }}
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  actions:
  - action: script.hitzeschutz_jalousien_checks_pruefen
    data:
      checks: >-
        {{
          [{
            'facade_name': facade_name,
            'facade_display_name': facade_display_name,
            'action_id': action_id,
            'cover_entities': cover_entities,
            'allow_automation': true
          }] | to_json
        }}
  mode: queued
  max: 10
- id: solar_heat_protection_blind_notification_periodic
  alias: Hitzeschutz Jalousie Nachcheck Schließen
  description: Prüft tagsüber stündlich geöffnete Jalousien an aktiven Hitzeschutz-Fassaden und schließt ohne manuellen Override automatisch.
  triggers:
  - trigger: time_pattern
    minutes: "0"
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  actions:
  - action: script.hitzeschutz_jalousien_fassadenstatus_pruefen
    data:
      facade_state: "on"
      action_id: close
      allow_automation: true
  mode: single
- id: solar_heat_protection_blind_open_notification_hourly
  alias: Hitzeschutz Jalousie Nachcheck Öffnen
  description: Prüft tagsüber stündlich geschlossene Jalousien an inaktiven Hitzeschutz-Fassaden und öffnet ohne manuellen Override automatisch.
  triggers:
  - trigger: time_pattern
    minutes: "0"
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  actions:
  - action: script.hitzeschutz_jalousien_fassadenstatus_pruefen
    data:
      facade_state: "off"
      action_id: open
      allow_automation: true
  mode: single
- id: hitzeschutz_og_automatik_bei_sonnenaufgang_aktivieren
  alias: Hitzeschutz OG Automatik bei Sonnenaufgang aktivieren
  description: Aktiviert die OG-Hitzeschutz-Automatik nach manueller Abschaltung am nächsten Morgen wieder.
  triggers:
  - trigger: sun
    event: sunrise
  conditions:
  - condition: state
    entity_id: switch.hitzeschutz_og_automatik
    state: "off"
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.hitzeschutz_og_automatik
  mode: single
- id: kueche_homepod_guten_morgen_erste_bedienung
  alias: Küche HomePod Guten Morgen bei erster Bedienung
  description: Sagt morgens beim ersten Einschalten von Küchenlicht oder Tisch-Schalter einmalig Guten Morgen.
  triggers:
  - trigger: state
    entity_id: light.eg_kueche_decke
    from: "off"
    to: "on"
  - trigger: state
    entity_id: switch.eg_kueche_tisch
    from: "off"
    to: "on"
  conditions:
  - condition: time
    after: "04:00:00"
    before: "11:00:00"
  - condition: template
    value_template: >-
      {{
        this.attributes.last_triggered is none
        or as_local(this.attributes.last_triggered).date() != now().date()
      }}
  actions:
  - variables:
      previous_volume: "{{ state_attr('media_player.homepod_kuche', 'volume_level') }}"
  - action: media_player.volume_set
    target:
      entity_id: media_player.homepod_kuche
    data:
      volume_level: 0.6
  - action: tts.speak
    target:
      entity_id: tts.home_assistant_cloud
    data:
      cache: true
      media_player_entity_id: media_player.homepod_kuche
      message: Guten Morgen
      language: de-DE
  - delay:
      seconds: 5
  - if:
    - condition: template
      value_template: "{{ previous_volume is number }}"
    then:
    - action: media_player.volume_set
      target:
        entity_id: media_player.homepod_kuche
      data:
        volume_level: "{{ previous_volume }}"
  mode: single
- id: schlafzimmer_klimaanlage_abends_kuehlen
  alias: Schlafzimmer Klimaanlage abends kühlen
  description: Schaltet die Schlafzimmer-Klimaanlage nach 17 Uhr bei Anwesenheit und Wärme in den Kühlmodus.
  triggers:
  - trigger: time
    at: "17:00:00"
  - trigger: state
    entity_id: binary_sensor.praesenz
    from: "off"
    to: "on"
  conditions:
  - condition: state
    entity_id: binary_sensor.praesenz
    state: "on"
  - condition: template
    value_template: "{{ now().hour >= 17 }}"
  - condition: numeric_state
    entity_id: sensor.og_schlafzimmer_thermostat_ist_temp
    above: 23
  - condition: state
    entity_id: climate.og_schlafzimmer_thermostat
    state: cool
  actions:
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.schlafzimmer
    data:
      hvac_mode: cool
  - if:
    - condition: template
      value_template: "{{ state_attr('climate.schlafzimmer', 'temperature') | float(99) > 22 }}"
    then:
    - action: climate.set_temperature
      target:
        entity_id: climate.schlafzimmer
      data:
        temperature: 22
        hvac_mode: cool
  mode: single
