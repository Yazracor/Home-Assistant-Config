  - if:
    - condition: state
      entity_id: binary_sensor.hitzeschutz_fassade_ost
      state: "off"
    then:
    - action: script.hitzeschutz_jalousie_fassade_pruefen
      data:
        facade_name: Fassade Ost
        action_id: open
        cover_entities: "{{ expand('group.fassade_ost') | map(attribute='entity_id') | list }}"
        allow_automation: false
  - if:
    - condition: state
      entity_id: binary_sensor.hitzeschutz_fassade_sud
      state: "off"
    then:
    - action: script.hitzeschutz_jalousie_fassade_pruefen
      data:
        facade_name: Fassade Sued
        action_id: open
        cover_entities: "{{ expand('group.fassade_sued') | map(attribute='entity_id') | list }}"
        allow_automation: false
  - if:
    - condition: state
      entity_id: binary_sensor.hitzeschutz_fassade_nord
      state: "off"
    then:
    - action: script.hitzeschutz_jalousie_fassade_pruefen
      data:
        facade_name: Fassade Nord
        action_id: open
        cover_entities: "{{ expand('group.fassade_nord') | map(attribute='entity_id') | list }}"
        allow_automation: false
  mode: single
