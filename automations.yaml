- id: solar_heat_protection_blind_recommendation
  alias: Hitzeschutz Jalousie OG Automatik und Empfehlung
  description: Fährt tagsüber OG-Jalousien für solaren Wärmeschutz und meldet EG/KG nur als Empfehlung.
  triggers:
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_west
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: west_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_ost
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: ost_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_sud
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: sued_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_nord
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: nord_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_west
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: west_open
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_ost
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: ost_open
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_sud
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: sued_open
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_nord
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: nord_open
  variables:
    facade_key: "{{ trigger.id.split('_')[0] }}"
    action_id: "{{ 'close' if trigger.id.endswith('_close') else 'open' }}"
    facade_group: "{{ 'group.fassade_' ~ facade_key }}"
    facade_name: >-
      {% set mapping = {
        'west': 'Fassade West',
        'ost': 'Fassade Ost',
        'sued': 'Fassade Sued',
        'nord': 'Fassade Nord'
      } %}
      {{ mapping.get(facade_key, trigger.id) }}
    cover_entities: "{{ expand(facade_group) | map(attribute='entity_id') | list }}"
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  actions:
  - action: script.hitzeschutz_jalousien_checks_pruefen
    data:
      checks: >-
        {{
          [{
            'facade_name': facade_name,
            'action_id': action_id,
            'cover_entities': cover_entities,
            'allow_automation': true
          }] | to_json
        }}
  mode: single
- id: solar_heat_protection_blind_notification_periodic
  alias: Hitzeschutz Jalousie Nachcheck Empfehlung
  description: Meldet tagsüber regelmäßig geöffnete Jalousien an aktiven Hitzeschutz-Fassaden, fährt aber nichts automatisch.
  triggers:
  - trigger: time_pattern
    minutes: "/30"
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  actions:
  - action: script.hitzeschutz_jalousien_fassadenstatus_pruefen
    data:
      facade_state: "on"
      action_id: close
      allow_automation: false
  mode: single
- id: solar_heat_protection_blind_open_notification_hourly
  alias: Hitzeschutz Jalousie Öffnen Empfehlung
  description: Meldet tagsüber stündlich geschlossene Jalousien an inaktiven Hitzeschutz-Fassaden, fährt aber nichts automatisch.
  triggers:
  - trigger: time_pattern
    minutes: "0"
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  actions:
  - action: script.hitzeschutz_jalousien_fassadenstatus_pruefen
    data:
      facade_state: "off"
      action_id: open
      allow_automation: false
  mode: single
- id: hitzeschutz_og_automatik_bei_sonnenaufgang_aktivieren
  alias: Hitzeschutz OG Automatik bei Sonnenaufgang aktivieren
  description: Aktiviert die OG-Hitzeschutz-Automatik nach manueller Abschaltung am nächsten Morgen wieder.
  triggers:
  - trigger: sun
    event: sunrise
  conditions:
  - condition: state
    entity_id: switch.hitzeschutz_og_automatik
    state: "off"
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.hitzeschutz_og_automatik
  mode: single
