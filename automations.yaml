- id: git_snapshot_after_ui_changes
  alias: Git snapshot after UI changes
  triggers:
  - trigger: time_pattern
    minutes: "/30"
  conditions: []
  actions:
  - action: shell_command.git_snapshot
    response_variable: git_snapshot
  - if:
    - condition: template
      value_template: "{{ git_snapshot.returncode != 0 }}"
    then:
    - action: persistent_notification.create
      data:
        title: Git snapshot failed
        message: >-
          git-snapshot.sh failed with return code {{ git_snapshot.returncode }}.
          stderr: {{ git_snapshot.stderr | default('') }}
          stdout: {{ git_snapshot.stdout | default('') }}
  mode: single
- id: '1780071059264'
  alias: Garage TTK Entfeuchter an
  description: Schaltet den TTK 75 Eco bei hoher Garagenfeuchte ein, solange es warm genug ist.
  triggers:
  - type: humidity
    device_id: 93c766f0890f4945e595ada307cdd6be
    entity_id: 40beacf828453f91eabae791ad7f8989
    domain: sensor
    trigger: device
    above: 60
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    above: 5.5
    for:
      hours: 0
      minutes: 10
      seconds: 0
  conditions:
  - condition: numeric_state
    entity_id: sensor.wifi_smart_switch_humidity
    above: 60
  - condition: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    above: 5.5
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.entfeuchter
    data: {}
  mode: single
- id: '1780071226885'
  alias: Garage TTK Entfeuchter aus
  description: Schaltet den TTK 75 Eco bei Ziel-Feuchte oder unter 5 Grad ab.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_humidity
    below: 55
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    below: 5
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: time_pattern
    minutes: "/5"
  conditions:
  - condition: state
    entity_id: switch.entfeuchter
    state: "on"
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.wifi_smart_switch_humidity
      below: 55
    - condition: numeric_state
      entity_id: sensor.wifi_smart_switch_temperature
      below: 5
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.entfeuchter
    data: {}
  mode: single
- id: garage_ttr_entfeuchter_boost_an
  alias: Garage TTR Entfeuchter Boost an
  description: Schaltet den TTR 57 zu, wenn der TTK in kalter Garage die Feuchte nicht schnell genug senkt.
  triggers:
  - trigger: state
    entity_id: switch.entfeuchter
    to: "on"
    for:
      hours: 0
      minutes: 45
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.entfeuchter_power
    below: 100
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_humidity
    above: 65
    for:
      hours: 0
      minutes: 30
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    below: 5
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: time_pattern
    minutes: "/15"
  conditions:
  - condition: numeric_state
    entity_id: sensor.wifi_smart_switch_humidity
    above: 63
  - condition: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    below: 12
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.wifi_smart_switch_temperature
      below: 5
    - condition: and
      conditions:
      - condition: state
        entity_id: switch.entfeuchter
        state: "on"
        for:
          hours: 0
          minutes: 45
          seconds: 0
      - condition: numeric_state
        entity_id: sensor.wifi_smart_switch_humidity
        above: 63
    - condition: and
      conditions:
      - condition: state
        entity_id: switch.entfeuchter
        state: "on"
      - condition: template
        value_template: >-
          {{
            states('sensor.entfeuchter_power') | float(999) < 100
            and now() - states.sensor.entfeuchter_power.last_changed > timedelta(minutes=10)
          }}
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.ttr_57_entfeuchter
    data: {}
  mode: single
- id: garage_ttr_entfeuchter_boost_aus
  alias: Garage TTR Entfeuchter Boost aus
  description: Schaltet den TTR 57 mit Hysterese ab, wenn die Feuchte wieder passt oder der TTK allein sinnvoller ist.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_humidity
    below: 58
    for:
      hours: 0
      minutes: 30
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    above: 13
    for:
      hours: 0
      minutes: 30
      seconds: 0
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.ttr_57_entfeuchter
    data: {}
  mode: single
- id: garage_entfeuchter_ohne_leistung_warnung
  alias: Garage Entfeuchter ohne Leistung Warnung
  description: Meldet, wenn ein Entfeuchter eingeschaltet ist, aber keine relevante Leistung zieht.
  triggers:
  - trigger: template
    value_template: >-
      {{
        is_state('switch.entfeuchter', 'on')
        and states('sensor.entfeuchter_power') | float(0) < 20
      }}
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: ttk
  - trigger: template
    value_template: >-
      {{
        is_state('switch.ttr_57_entfeuchter', 'on')
        and states('sensor.ttr_57_entfeuchter_leistung') | float(0) < 20
      }}
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: ttr
  actions:
  - action: notify.mobile_app_torbens_iphone
    metadata: {}
    data:
      title: Entfeuchter ohne Leistung
      message: >-
        {% if trigger.id == 'ttk' %}
          TTK 75 Eco ist eingeschaltet, zieht aber keine Leistung.
        {% else %}
          TTR 57 ist eingeschaltet, zieht aber keine Leistung.
        {% endif %}
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1
  mode: single
- id: '1780073742923'
  alias: Garagenwarnung
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - cover.aussenbereich_garage_garagentor
    for:
      hours: 0
      minutes: 5
      seconds: 0
    to:
    - open
  conditions: []
  actions:
  - repeat:
      while:
      - condition: state
        entity_id: cover.aussenbereich_garage_garagentor
        state:
        - open
      sequence:
      - action: notify.mobile_app_torbens_iphone
        metadata: {}
        data:
          message: Garage offen!
          title: Die Garage ist noch offen!
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1
      - delay:
          hours: 0
          minutes: 30
          seconds: 0
          milliseconds: 0

  mode: single
- id: solar_heat_protection_blind_recommendation
  alias: Hitzeschutz Jalousie OG Automatik und Empfehlung
  description: Fährt tagsüber OG-Jalousien für solaren Wärmeschutz und meldet EG/KG nur als Empfehlung.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.hitzeschutz_fassade_west
    - binary_sensor.hitzeschutz_fassade_ost
    - binary_sensor.hitzeschutz_fassade_sud
    - binary_sensor.hitzeschutz_fassade_nord
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: close
  - trigger: state
    entity_id:
    - binary_sensor.hitzeschutz_fassade_west
    - binary_sensor.hitzeschutz_fassade_ost
    - binary_sensor.hitzeschutz_fassade_sud
    - binary_sensor.hitzeschutz_fassade_nord
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: open
  variables:
    facade_group: >-
      {% set mapping = {
        'binary_sensor.hitzeschutz_fassade_west': 'group.fassade_west',
        'binary_sensor.hitzeschutz_fassade_ost': 'group.fassade_ost',
        'binary_sensor.hitzeschutz_fassade_sud': 'group.fassade_sued',
        'binary_sensor.hitzeschutz_fassade_nord': 'group.fassade_nord'
      } %}
      {{ mapping.get(trigger.entity_id, '') }}
    facade_name: >-
      {{ state_attr(trigger.entity_id, 'friendly_name') | default('Hitzeschutz', true) | replace('Hitzeschutz ', '') }}
    og_cover_entity_ids: >-
      {{ floor_entities('obergeschoss') | select('match', '^cover\.') | list }}
    bedroom_cover_entity_ids: >-
      {{ area_entities('schlafzimmer') | select('match', '^cover\.') | list }}
    action_verb: "{{ 'Schließen' if trigger.id == 'close' else 'Öffnen' }}"
    hitzeschutz_plan: >-
      {# Erstellt einmalig den Plan für Automatik und Benachrichtigung. #}
      {% set plan = namespace(
        og_auto_names=[],
        og_blocked_names=[],
        recommendation_names=[],
        og_action_entities=[]
      ) %}
      {% for cover in expand(facade_group) %}
        {% set pos = cover.attributes.current_position if cover.attributes.current_position is defined else none %}
        {% set current = ((pos | round(0) | int) ~ '%') if pos is number else cover.state %}
        {% set too_open = (pos is number and pos > 25) or (pos is not number and cover.state in ['open', 'opening']) %}
        {% set too_closed = (pos is number and pos < 80) or (pos is not number and cover.state in ['closed', 'closing']) %}
        {% set should_close = trigger.id == 'close' and too_open %}
        {% set should_open = trigger.id == 'open' and too_closed %}
        {% set needs_change = should_close or should_open %}
        {% set is_og_cover = cover.entity_id in og_cover_entity_ids %}
        {% set bedroom_open_blocked = (
          trigger.id == 'open'
          and now().hour < 10
          and cover.entity_id in bedroom_cover_entity_ids
        ) %}
        {% set target = cover.name ~ ' (' ~ current ~ ')' %}
        {% if needs_change %}
          {% if is_og_cover and not bedroom_open_blocked %}
            {% set plan.og_auto_names = plan.og_auto_names + [target] %}
            {% set plan.og_action_entities = plan.og_action_entities + [cover.entity_id] %}
          {% elif is_og_cover %}
            {% set plan.og_blocked_names = plan.og_blocked_names + [target] %}
          {% else %}
            {% set plan.recommendation_names = plan.recommendation_names + [target] %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ {
        'og_auto_names': plan.og_auto_names,
        'og_blocked_names': plan.og_blocked_names,
        'recommendation_names': plan.recommendation_names,
        'og_action_entities': plan.og_action_entities
      } | to_json }}
    recommendation_message: >-
      {% set lux = states('sensor.aussenbereich_wetterstation_helligkeit') | float(0) %}
      {% set outside_temp = states('sensor.aussenbereich_wetterstation_temperatur') | float(0) %}
      {% set azimuth = state_attr('sun.sun', 'azimuth') | float(0) %}
      {% set elevation = state_attr('sun.sun', 'elevation') | float(0) %}
      {% set plan = hitzeschutz_plan | from_json %}
      {% set og_mode = 'automatisch' if is_state('switch.hitzeschutz_og_automatik', 'on') else 'Empfehlung' %}
      {% set og_suffix = '' if is_state('switch.hitzeschutz_og_automatik', 'on') else ' (Automatik aus)' %}
      {% if plan.og_auto_names or plan.og_blocked_names or plan.recommendation_names %}
      {% if plan.og_auto_names %}
      {{ action_verb }} {{ og_mode }} OG {{ facade_name }}: {{ plan.og_auto_names | join(', ') }}{{ og_suffix }}
      {% endif %}
      {% if plan.og_blocked_names %}
      {{ action_verb }} Empfehlung OG {{ facade_name }}: {{ plan.og_blocked_names | join(', ') }} (Schlafzimmer vor 10:00 nicht automatisch)
      {% endif %}
      {% if plan.recommendation_names %}
      {{ action_verb }} Empfehlung EG/KG {{ facade_name }}: {{ plan.recommendation_names | join(', ') }}
      {% endif %}

      Helligkeit: {{ lux | round(0) }} lx, außen: {{ outside_temp | round(1) }} °C, Sonne: {{ elevation | round(1) }}° / {{ azimuth | round(0) }}°.
      {% endif %}
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  - condition: template
    value_template: "{{ recommendation_message | trim != '' }}"
  actions:
  - if:
    - condition: state
      entity_id: switch.hitzeschutz_og_automatik
      state: "on"
    - condition: template
      value_template: "{{ (hitzeschutz_plan | from_json).og_action_entities | count > 0 }}"
    then:
    - repeat:
        for_each: "{{ (hitzeschutz_plan | from_json).og_action_entities }}"
        sequence:
        - action: "cover.{{ 'close_cover' if trigger.id == 'close' else 'open_cover' }}"
          target:
            entity_id: "{{ repeat.item }}"
  - action: notify.mobile_app_torbens_iphone
    metadata: {}
    data:
      title: "Jalousien: Hitzeschutz"
      message: "{{ recommendation_message | trim }}"
      data:
        push:
          sound:
            name: default
  mode: single
