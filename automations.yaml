- id: git_snapshot_after_ui_changes
  alias: Git snapshot after UI changes
  triggers:
  - trigger: time_pattern
    minutes: /30
  actions:
  - action: shell_command.git_snapshot
- id: '1780071059264'
  alias: Entfeuchter an
  description: ''
  triggers:
  - type: humidity
    device_id: 93c766f0890f4945e595ada307cdd6be
    entity_id: 40beacf828453f91eabae791ad7f8989
    domain: sensor
    trigger: device
    above: 65
  conditions: []
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.entfeuchter
    data: {}
  mode: single
- id: '1780071226885'
  alias: Entfeuchter aus
  description: ''
  triggers:
  - type: humidity
    device_id: 93c766f0890f4945e595ada307cdd6be
    entity_id: 40beacf828453f91eabae791ad7f8989
    domain: sensor
    trigger: device
    below: 60
    for:
      hours: 0
      minutes: 0
      seconds: 0
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.entfeuchter
    data: {}
  mode: single
- id: '1780073742923'
  alias: Garagenwarnung
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - cover.aussenbereich_garage_garagentor
    attribute: current_position
    from:
    - Closed
    to:
    - Open
    for:
      hours: 0
      minutes: 0
      seconds: 20
  conditions: []
  actions:
  - action: notify.mobile_app_torbens_iphone
    metadata: {}
    data:
      message: Garage offen!
  mode: single
