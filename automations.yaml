  triggers:
  - trigger: state
    entity_id: switch.entfeuchter
    to: "on"
    for:
      hours: 0
      minutes: 45
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.entfeuchter_power
    below: 100
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_humidity
    above: 63
    for:
      hours: 0
      minutes: 45
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    below: 5
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: time_pattern
    minutes: "/15"
  conditions:
  - condition: state
    entity_id: switch.entfeuchter
    state: "on"
    for:
      hours: 0
      minutes: 45
      seconds: 0
  - condition: state
    entity_id: binary_sensor.garage_feuchte_ueber_65
    state: "on"
    for:
      hours: 0
      minutes: 45
      seconds: 0
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.ttr_57_entfeuchter
    data: {}
  mode: single
- id: garage_ttr_entfeuchter_boost_aus
  alias: Garage TTR Entfeuchter Boost aus
  description: Schaltet den TTR 57 mit Hysterese ab, wenn die Feuchte wieder passt oder der TTK stoppt.
  triggers:
  - trigger: state
    entity_id: binary_sensor.garage_feuchte_unter_60
    to: "on"
    for:
      hours: 0
      minutes: 30
      seconds: 0
  - trigger: state
    entity_id: switch.entfeuchter
    to: "off"
    for:
      hours: 0
      minutes: 2
      seconds: 0
  - trigger: time_pattern
    minutes: "/5"
  conditions:
  - condition: state
    entity_id: switch.ttr_57_entfeuchter
    state: "on"
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.garage_feuchte_unter_60
      state: "on"
      for:
        hours: 0
        minutes: 30
        seconds: 0
    - condition: and
      conditions:
      - condition: state
        entity_id: switch.entfeuchter
        state: "off"
        for:
          hours: 0
          minutes: 2
          seconds: 0
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.ttr_57_entfeuchter
    data: {}
  mode: single
- id: garage_entfeuchter_boost_startfeuchte_merken
  alias: Garage Entfeuchter Boost Startfeuchte merken
  description: Merkt die Luftfeuchte, wenn beide Garagen-Entfeuchter gemeinsam laufen.
  triggers:
  - trigger: state
    entity_id: switch.entfeuchter
    from: "off"
    to: "on"
  - trigger: state
    entity_id: switch.ttr_57_entfeuchter
    from: "off"
    to: "on"
  conditions:
  - condition: state
    entity_id: switch.entfeuchter
    state: "on"
  - condition: state
    entity_id: switch.ttr_57_entfeuchter
    state: "on"
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.garage_entfeuchtung_boost_startfeuchte
    data:
      value: "{{ states('sensor.wifi_smart_switch_humidity') | float(0) }}"
  mode: single
- id: garage_entfeuchter_ohne_leistung_warnung
  alias: Garage Entfeuchter ohne Leistung Warnung
  description: Meldet, wenn ein Entfeuchter eingeschaltet ist, aber keine relevante Leistung zieht.
  triggers:
  - trigger: template
    value_template: >-
      {{
        is_state('switch.entfeuchter', 'on')
        and states('sensor.entfeuchter_power') | float(0) < 20
      }}
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: ttk
  - trigger: template
    value_template: >-
      {{
        is_state('switch.ttr_57_entfeuchter', 'on')
        and states('sensor.ttr_57_entfeuchter_leistung') | float(0) < 20
      }}
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: ttr
  actions:
  - action: notify.mobile_app_torbens_iphone
    metadata: {}
    data:
      title: Entfeuchter ohne Leistung
      message: >-
        {% if trigger.id == 'ttk' %}
          TTK 75 Eco ist eingeschaltet, zieht aber keine Leistung.
        {% else %}
          TTR 57 ist eingeschaltet, zieht aber keine Leistung.
        {% endif %}
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1
  mode: single
- id: '1780073742923'
  alias: Garagenwarnung
  description: Meldet bei offenem Garagentor nach 5 Minuten, bei Abwesenheit sofort.
  triggers:
  - trigger: state
    entity_id:
    - cover.aussenbereich_garage_garagentor
    for:
      hours: 0
      minutes: 5
      seconds: 0
    to:
    - open
    id: offen
  - trigger: state
    entity_id:
    - cover.aussenbereich_garage_garagentor
    to:
    - open
    id: offen_abwesend
  - trigger: state
    entity_id: binary_sensor.person_zuhause
    to: "off"
    id: abwesend
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: offen
    - condition: and
      conditions:
      - condition: trigger
        id:
        - offen_abwesend
        - abwesend
      - condition: state
        entity_id: binary_sensor.person_zuhause
        state: "off"
      - condition: state
        entity_id: cover.aussenbereich_garage_garagentor
        state:
        - open
  actions:
  - repeat:
      while:
      - condition: state
        entity_id: cover.aussenbereich_garage_garagentor
        state:
        - open
      sequence:
      - action: notify.mobile_app_torbens_iphone
        metadata: {}
        data:
          message: Garage offen!
          title: Die Garage ist noch offen!
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1
      - delay:
          hours: 0
          minutes: 30
          seconds: 0
          milliseconds: 0

  mode: single
- id: garage_entfeuchter_startfeuchte_merker
  alias: Garage Entfeuchter Startfeuchte merken
  description: Merkt die Luftfeuchte, wenn die Entfeuchtung aus dem Stillstand startet.
  triggers:
  - trigger: state
    entity_id: switch.entfeuchter
    from: "off"
    to: "on"
  - trigger: state
    entity_id: switch.ttr_57_entfeuchter
    from: "off"
    to: "on"
  conditions:
  - condition: template
    value_template: >-
      {{
        (
        trigger.entity_id == 'switch.entfeuchter'
        and not is_state('switch.ttr_57_entfeuchter', 'on')
        )
        or (
        trigger.entity_id == 'switch.ttr_57_entfeuchter'
        and not is_state('switch.entfeuchter', 'on')
        )
      }}
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.garage_entfeuchtung_startfeuchte
    data:
      value: "{{ states('sensor.wifi_smart_switch_humidity') | float(0) }}"
  mode: single
- id: garage_entfeuchter_trocknet_nicht_genug
  alias: Garage Entfeuchter trocknet nicht genug
  description: Meldet, wenn die Garagenfeuchte nach mehreren Stunden Entfeuchtung kaum sinkt.
  triggers:
  - trigger: template
    value_template: >-
      {% set running = [
        states.switch.entfeuchter,
        states.switch.ttr_57_entfeuchter
      ] | selectattr('state', 'eq', 'on') | list %}
      {% set oldest_ts = running | map(attribute='last_changed') | map('as_timestamp') | min if running | count > 0 else 0 %}
      {% set start = states('input_number.garage_entfeuchtung_startfeuchte') | float(0) %}
      {% set current = states('sensor.wifi_smart_switch_humidity') | float(0) %}
      {{
        running | count > 0
        and oldest_ts > 0
        and now() | as_timestamp - oldest_ts > 3 * 3600
        and current > 60
        and start - current < 3
      }}
  conditions:
  - condition: state
    entity_id: input_boolean.garage_entfeuchtung_warnung_aktiv
    state: "off"
  actions:
  - action: notify.mobile_app_torbens_iphone
    metadata: {}
    data:
      title: Garage trocknet kaum
      message: >-
        Die Garagenfeuchte ist nach mehreren Stunden Entfeuchtung kaum gesunken:
        Start {{ states('input_number.garage_entfeuchtung_startfeuchte') | float(0) | round(1) }} %,
        jetzt {{ states('sensor.wifi_smart_switch_humidity') | float(0) | round(1) }} %.
        Temperatur: {{ states('sensor.wifi_smart_switch_temperature') | float(0) | round(1) }} °C.
        TTK: {{ states('switch.entfeuchter') }}, TTR: {{ states('switch.ttr_57_entfeuchter') }}.
      data:
        push:
          sound:
            name: default
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.garage_entfeuchtung_warnung_aktiv
  mode: single
- id: garage_entfeuchter_beide_feuchte_steigt_warnung
  alias: Garage Entfeuchter beide Feuchte steigt Warnung
  description: Meldet, wenn die Garagenfeuchte trotz beider laufender Entfeuchter weiter steigt.
  triggers:
  - trigger: template
    value_template: >-
      {% set start = states('input_number.garage_entfeuchtung_boost_startfeuchte') | float(0) %}
      {% set current = states('sensor.wifi_smart_switch_humidity') | float(0) %}
      {{
        is_state('switch.entfeuchter', 'on')
        and is_state('switch.ttr_57_entfeuchter', 'on')
        and now() - states.switch.entfeuchter.last_changed > timedelta(hours=1)
        and now() - states.switch.ttr_57_entfeuchter.last_changed > timedelta(hours=1)
        and current > 60
        and current - start >= 1
      }}
  conditions:
  - condition: state
    entity_id: input_boolean.garage_entfeuchtung_warnung_aktiv
    state: "off"
  actions:
  - action: notify.mobile_app_torbens_iphone
    metadata: {}
    data:
      title: Garage wird trotz Boost feuchter
      message: >-
        Die Garagenfeuchte steigt trotz TTK und TTR:
        Boost-Start {{ states('input_number.garage_entfeuchtung_boost_startfeuchte') | float(0) | round(1) }} %,
        jetzt {{ states('sensor.wifi_smart_switch_humidity') | float(0) | round(1) }} %.
        Temperatur: {{ states('sensor.wifi_smart_switch_temperature') | float(0) | round(1) }} °C.
        TTK-Leistung: {{ states('sensor.entfeuchter_power') | float(0) | round(0) }} W,
        TTR-Leistung: {{ states('sensor.ttr_57_entfeuchter_leistung') | float(0) | round(0) }} W.
      data:
        push:
          sound:
            name: default
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.garage_entfeuchtung_warnung_aktiv
  mode: single
- id: garage_entfeuchter_feuchte_wieder_ok
  alias: Garage Entfeuchter Feuchte wieder ok
  description: Meldet einmalig Entwarnung, wenn die Garagenfeuchte nach einer Entfeuchtungswarnung wieder bis 59 Prozent liegt.
  triggers:
  - trigger: state
    entity_id: binary_sensor.garage_feuchte_unter_60
    to: "on"
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - condition: state
    entity_id: input_boolean.garage_entfeuchtung_warnung_aktiv
    state: "on"
  actions:
  - action: notify.mobile_app_torbens_iphone
    metadata: {}
    data:
      title: Garage wieder bis 59 Prozent
      message: >-
        Die Garagenfeuchte ist wieder bei
        {{ states('sensor.wifi_smart_switch_humidity') | float(0) | round(1) }} %.
        TTK: {{ states('switch.entfeuchter') }},
        TTR: {{ states('switch.ttr_57_entfeuchter') }}.
      data:
        push:
          sound:
            name: default
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.garage_entfeuchtung_warnung_aktiv
  mode: single
- id: abendstatus_haus_hinweise
  alias: Abendstatus Haus Hinweise
  description: Schickt um 20 Uhr eine kompakte Zusammenfassung offener Punkte.
  triggers:
  - trigger: time
    at: "20:00:00"
  variables:
    outdoor_lights:
      - light.aussenbereich_eingangsbereich_eingang_vordach
      - light.aussenbereich_balkon_licht
      - light.aussenbereich_garten_aussenleuchten_rechts
      - light.aussenbereich_balkon_balken
      - light.aussenbereich_balkon_obergeschoss_licht
      - light.aussenbereich_terrasse_licht
      - light.aussenbereich_garage_licht
      - light.aussenbereich_eingangsbereich_treppe_und_garage
      - light.aussenbereich_eingangsbereich_hof_bega_baumstrahler
      - light.aussenbereich_teich_licht
      - light.aussenbereich_teich_unterwasserstrahler
      - light.aussenbereich_garten_wegebeleuchtung_nach_oben
      - light.aussenbereich_garten_aussenleuchten_links
    digest_items: >-
      {% set ns = namespace(items=[]) %}
      {% if is_state('cover.aussenbereich_garage_garagentor', 'open') %}
        {% set ns.items = ns.items + ['- Garage ist offen'] %}
      {% endif %}
      {% set lights_on = expand(outdoor_lights) | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
      {% if lights_on | count > 0 %}
        {% set ns.items = ns.items + ['- Außenlicht an: ' ~ lights_on | join(', ')] %}
      {% endif %}
      {% if is_state('switch.hitzeschutz_og_automatik', 'off') %}
        {% set ns.items = ns.items + ['- Hitzeschutz OG Automatik ist aus'] %}
      {% endif %}
      {% set humidity = states('sensor.wifi_smart_switch_humidity') | float(0) %}
      {% if humidity > 65 %}
        {% set ns.items = ns.items + ['- Garage feucht: ' ~ (humidity | round(0) | string) ~ ' %'] %}
      {% endif %}
      {% set drying = is_state('switch.entfeuchter', 'on') or is_state('switch.ttr_57_entfeuchter', 'on') %}
      {% set start = states('input_number.garage_entfeuchtung_startfeuchte') | float(0) %}
      {% if drying and start > 0 and start - humidity < 3 and humidity > 60 %}
        {% set ns.items = ns.items + ['- Garage trocknet kaum seit Entfeuchtungsstart'] %}
      {% endif %}
      {{ ns.items | to_json }}
  actions:
  - action: notify.mobile_app_torbens_iphone
    metadata: {}
    data:
      title: Abendstatus Haus
      message: >-
        {% set items = digest_items | from_json %}
        {% if items | count > 0 %}
          {{ items | join('\n') }}
        {% else %}
          Alles ruhig.
        {% endif %}
      data:
        push:
          sound:
            name: default
  mode: single
- id: garage_regen_bei_offenem_tor_warnung
  alias: Garage Regen bei offenem Tor Warnung
  description: Meldet, wenn Regen beginnt und das Garagentor offen ist.
  triggers:
  - trigger: state
    entity_id: binary_sensor.aussenbereich_wetterstation_niederschlag
    from: "off"
    to: "on"
  conditions:
  - condition: state
    entity_id: cover.aussenbereich_garage_garagentor
    state:
    - open
  actions:
  - action: notify.mobile_app_torbens_iphone
    metadata: {}
    data:
      title: Garage offen bei Regen
      message: Es regnet und das Garagentor ist offen.
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1
  mode: single
- id: adaptive_helligkeit_manuelle_lichtbedienung_merken
  alias: Adaptive Helligkeit manuelle Lichtbedienung merken
  description: Merkt pro dimmbarem Licht, wann es zuletzt manuell oder extern bedient wurde.
  triggers:
  - trigger: event
    event_type: knx_event
    id: knx
  - trigger: event
    event_type: homekit_state_change
    id: homekit
  - trigger: event
    event_type: call_service
    id: service
  variables:
    adaptive_light_entities: "{{ expand('group.adaptive_helligkeit_lichter') | map(attribute='entity_id') | list }}"
    touched_light_entities: >-
      {% from 'adaptive_lighting.jinja' import knx_light_map %}
      {% from 'manual_control.jinja' import touched_entities %}
      {% set knx_light_map = knx_light_map | as_function %}
      {% set touched_entities = touched_entities | as_function %}
      {{ touched_entities(trigger.id, trigger.event.data, trigger.event.context.user_id, adaptive_light_entities, knx_light_map(), 'light', true) | to_json }}
  conditions:
  - condition: template
    value_template: "{{ touched_light_entities | from_json(default=[]) | count > 0 }}"
  actions:
  - repeat:
      for_each: "{{ touched_light_entities | from_json(default=[]) }}"
      sequence:
      - variables:
          manual_helper: >-
            {% from 'adaptive_lighting.jinja' import manual_helper %}
            {% set manual_helper = manual_helper | as_function %}
            {{ manual_helper(repeat.item) }}
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ manual_helper }}"
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  mode: queued
- id: adaptive_helligkeit_nachtlicht_beim_einschalten
  alias: Adaptive Helligkeit Nachtlicht beim Einschalten
  description: Dimmt bestimmte Lichter nachts nach dem Einschalten auf 2 Prozent, ohne manuelle Dimmung zu überschreiben.
  triggers:
  - trigger: state
    entity_id:
    - light.eg_arbeitszimmer_decke
    - light.og_flur_decke
    - light.og_bad_decke
    to: "on"
  conditions:
  - condition: state
    entity_id: switch.schlafmodus
    state: "on"
  actions:
  - action: script.adaptive_helligkeit_nachtlicht_dimmen
    data:
      light_entity: "{{ trigger.entity_id }}"
  mode: single
- id: schlafmodus_zeitplan
  alias: Schlafmodus Zeitplan
  description: Schaltet den Schlafmodus abhängig von Arbeitstagen und freien Tagen in Hessen.
  triggers:
  - trigger: time
    at: "22:00:00"
    id: workday_tomorrow_on
  - trigger: time
    at: "07:30:00"
    id: workday_today_off
  - trigger: time
    at: "23:00:00"
    id: free_tomorrow_on
  - trigger: time
    at: "09:00:00"
    id: free_today_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: workday_tomorrow_on
      - condition: state
        entity_id: binary_sensor.arbeitstag_morgen
        state: "on"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.schlafmodus
    - conditions:
      - condition: trigger
        id: workday_today_off
      - condition: state
        entity_id: binary_sensor.arbeitstag
        state: "on"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.schlafmodus
    - conditions:
      - condition: trigger
        id: free_tomorrow_on
      - condition: state
        entity_id: binary_sensor.arbeitstag_morgen
        state: "off"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.schlafmodus
    - conditions:
      - condition: trigger
        id: free_today_off
      - condition: state
        entity_id: binary_sensor.arbeitstag
        state: "off"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.schlafmodus
  mode: single
- id: adaptive_helligkeit_lichter_nach_aussenhelligkeit
  alias: Adaptive Helligkeit Lichter nach Außenhelligkeit
  description: Dimmt bereits eingeschaltete dimmbare Lichter passend zur Außenhelligkeit, ohne manuelle Bedienung zu überschreiben.
  triggers:
  - trigger: numeric_state
