- id: git_snapshot_after_ui_changes
  alias: Git snapshot after UI changes
  triggers:
  - trigger: time_pattern
    minutes: "/30"
  conditions: []
  actions:
  - action: shell_command.git_snapshot
    response_variable: git_snapshot
  - if:
    - condition: template
      value_template: "{{ git_snapshot.returncode != 0 }}"
    then:
    - action: persistent_notification.create
      data:
        title: Git snapshot failed
        message: >-
          git-snapshot.sh failed with return code {{ git_snapshot.returncode }}.
          stderr: {{ git_snapshot.stderr | default('') }}
          stdout: {{ git_snapshot.stdout | default('') }}
  mode: single
- id: '1780071059264'
  alias: Garage TTK Entfeuchter an
  description: Schaltet den TTK 75 Eco bei hoher Garagenfeuchte ein, solange es warm genug ist.
  triggers:
  - type: humidity
    device_id: 93c766f0890f4945e595ada307cdd6be
    entity_id: 40beacf828453f91eabae791ad7f8989
    domain: sensor
    trigger: device
    above: 60
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    above: 5.5
    for:
      hours: 0
      minutes: 10
      seconds: 0
  conditions:
  - condition: numeric_state
    entity_id: sensor.wifi_smart_switch_humidity
    above: 60
  - condition: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    above: 5.5
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.entfeuchter
    data: {}
  mode: single
- id: '1780071226885'
  alias: Garage TTK Entfeuchter aus
  description: Schaltet den TTK 75 Eco bei Ziel-Feuchte oder unter 5 Grad ab.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_humidity
    below: 55
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    below: 5
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: time_pattern
    minutes: "/5"
  conditions:
  - condition: state
    entity_id: switch.entfeuchter
    state: "on"
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.wifi_smart_switch_humidity
      below: 55
    - condition: numeric_state
      entity_id: sensor.wifi_smart_switch_temperature
      below: 5
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.entfeuchter
    data: {}
  mode: single
- id: garage_ttr_entfeuchter_boost_an
  alias: Garage TTR Entfeuchter Boost an
  description: Schaltet den TTR 57 zu, wenn der TTK in kalter Garage die Feuchte nicht schnell genug senkt.
  triggers:
  - trigger: state
    entity_id: switch.entfeuchter
    to: "on"
    for:
      hours: 0
      minutes: 45
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.entfeuchter_power
    below: 100
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_humidity
    above: 65
    for:
      hours: 0
      minutes: 30
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    below: 5
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: time_pattern
    minutes: "/15"
  conditions:
  - condition: numeric_state
    entity_id: sensor.wifi_smart_switch_humidity
    above: 63
  - condition: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    below: 12
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.wifi_smart_switch_temperature
      below: 5
    - condition: and
      conditions:
      - condition: state
        entity_id: switch.entfeuchter
        state: "on"
        for:
          hours: 0
          minutes: 45
          seconds: 0
      - condition: numeric_state
        entity_id: sensor.wifi_smart_switch_humidity
        above: 63
    - condition: and
      conditions:
      - condition: state
        entity_id: switch.entfeuchter
        state: "on"
      - condition: template
        value_template: >-
          {{
            states('sensor.entfeuchter_power') | float(999) < 100
            and now() - states.sensor.entfeuchter_power.last_changed > timedelta(minutes=10)
          }}
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.ttr_57_entfeuchter
    data: {}
  mode: single
- id: garage_ttr_entfeuchter_boost_aus
  alias: Garage TTR Entfeuchter Boost aus
  description: Schaltet den TTR 57 mit Hysterese ab, wenn die Feuchte wieder passt oder der TTK allein sinnvoller ist.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_humidity
    below: 58
    for:
      hours: 0
      minutes: 30
      seconds: 0
  - trigger: numeric_state
    entity_id: sensor.wifi_smart_switch_temperature
    above: 13
    for:
      hours: 0
      minutes: 30
      seconds: 0
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.ttr_57_entfeuchter
    data: {}
  mode: single
- id: garage_entfeuchter_ohne_leistung_warnung
  alias: Garage Entfeuchter ohne Leistung Warnung
  description: Meldet, wenn ein Entfeuchter eingeschaltet ist, aber keine relevante Leistung zieht.
  triggers:
  - trigger: template
    value_template: >-
      {{
        is_state('switch.entfeuchter', 'on')
        and states('sensor.entfeuchter_power') | float(0) < 20
      }}
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: ttk
  - trigger: template
    value_template: >-
      {{
        is_state('switch.ttr_57_entfeuchter', 'on')
        and states('sensor.ttr_57_entfeuchter_leistung') | float(0) < 20
      }}
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: ttr
  actions:
  - action: notify.mobile_app_torbens_iphone
    metadata: {}
    data:
      title: Entfeuchter ohne Leistung
      message: >-
        {% if trigger.id == 'ttk' %}
          TTK 75 Eco ist eingeschaltet, zieht aber keine Leistung.
        {% else %}
          TTR 57 ist eingeschaltet, zieht aber keine Leistung.
        {% endif %}
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1
  mode: single
- id: '1780073742923'
  alias: Garagenwarnung
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - cover.aussenbereich_garage_garagentor
    for:
      hours: 0
      minutes: 5
      seconds: 0
    to:
    - open
  conditions: []
  actions:
  - repeat:
      while:
      - condition: state
        entity_id: cover.aussenbereich_garage_garagentor
        state:
        - open
      sequence:
      - action: notify.mobile_app_torbens_iphone
        metadata: {}
        data:
          message: Garage offen!
          title: Die Garage ist noch offen!
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1
      - delay:
          hours: 0
          minutes: 30
          seconds: 0
          milliseconds: 0

  mode: single
- id: solar_heat_protection_blind_recommendation
  alias: Hitzeschutz Jalousie OG Automatik und Empfehlung
  description: Fährt tagsüber OG-Jalousien für solaren Wärmeschutz und meldet EG/KG nur als Empfehlung.
  triggers:
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_west
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: west_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_ost
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: ost_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_sud
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: sued_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_nord
    from: "off"
    to: "on"
    for:
      minutes: 10
    id: nord_close
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_west
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: west_open
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_ost
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: ost_open
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_sud
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: sued_open
  - trigger: state
    entity_id: binary_sensor.hitzeschutz_fassade_nord
    from: "on"
    to: "off"
    for:
      minutes: 30
    id: nord_open
  variables:
    action_id: "{{ 'close' if trigger.id.endswith('_close') else 'open' }}"
    facade_group: >-
      {% set mapping = {
        'west_close': 'group.fassade_west',
        'west_open': 'group.fassade_west',
        'ost_close': 'group.fassade_ost',
        'ost_open': 'group.fassade_ost',
        'sued_close': 'group.fassade_sued',
        'sued_open': 'group.fassade_sued',
        'nord_close': 'group.fassade_nord',
        'nord_open': 'group.fassade_nord'
      } %}
      {{ mapping.get(trigger.id, '') }}
    facade_name: >-
      {% set mapping = {
        'west_close': 'Fassade West',
        'west_open': 'Fassade West',
        'ost_close': 'Fassade Ost',
        'ost_open': 'Fassade Ost',
        'sued_close': 'Fassade Sued',
        'sued_open': 'Fassade Sued',
        'nord_close': 'Fassade Nord',
        'nord_open': 'Fassade Nord'
      } %}
      {{ mapping.get(trigger.id, trigger.id) }}
    cover_entities: >-
      {% set mapping = {
        'west_close': 'group.fassade_west',
        'west_open': 'group.fassade_west',
        'ost_close': 'group.fassade_ost',
        'ost_open': 'group.fassade_ost',
        'sued_close': 'group.fassade_sued',
        'sued_open': 'group.fassade_sued',
        'nord_close': 'group.fassade_nord',
        'nord_open': 'group.fassade_nord'
      } %}
      {{ expand(mapping.get(trigger.id, '')) | map(attribute='entity_id') | list }}
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  actions:
  - action: script.hitzeschutz_jalousie_fassade_pruefen
    data:
      facade_name: "{{ facade_name }}"
      action_id: "{{ action_id }}"
      cover_entities: "{{ cover_entities }}"
      allow_automation: true
  mode: single
- id: solar_heat_protection_blind_notification_periodic
  alias: Hitzeschutz Jalousie Nachcheck Empfehlung
  description: Meldet tagsüber regelmäßig geöffnete Jalousien an aktiven Hitzeschutz-Fassaden, fährt aber nichts automatisch.
  triggers:
  - trigger: time_pattern
    minutes: "/30"
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.hitzeschutz_fassade_west
      state: "on"
    then:
    - action: script.hitzeschutz_jalousie_fassade_pruefen
      data:
        facade_name: Fassade West
        action_id: close
        cover_entities: "{{ expand('group.fassade_west') | map(attribute='entity_id') | list }}"
        allow_automation: false
  - if:
    - condition: state
      entity_id: binary_sensor.hitzeschutz_fassade_ost
      state: "on"
    then:
    - action: script.hitzeschutz_jalousie_fassade_pruefen
      data:
        facade_name: Fassade Ost
        action_id: close
        cover_entities: "{{ expand('group.fassade_ost') | map(attribute='entity_id') | list }}"
        allow_automation: false
  - if:
    - condition: state
      entity_id: binary_sensor.hitzeschutz_fassade_sud
      state: "on"
    then:
    - action: script.hitzeschutz_jalousie_fassade_pruefen
      data:
        facade_name: Fassade Sued
        action_id: close
        cover_entities: "{{ expand('group.fassade_sued') | map(attribute='entity_id') | list }}"
        allow_automation: false
  - if:
    - condition: state
      entity_id: binary_sensor.hitzeschutz_fassade_nord
      state: "on"
    then:
    - action: script.hitzeschutz_jalousie_fassade_pruefen
      data:
        facade_name: Fassade Nord
        action_id: close
        cover_entities: "{{ expand('group.fassade_nord') | map(attribute='entity_id') | list }}"
        allow_automation: false
  mode: single
- id: solar_heat_protection_blind_open_notification_hourly
  alias: Hitzeschutz Jalousie Öffnen Empfehlung
  description: Meldet tagsüber stündlich geschlossene Jalousien an inaktiven Hitzeschutz-Fassaden, fährt aber nichts automatisch.
  triggers:
  - trigger: time_pattern
    minutes: "0"
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.hitzeschutz_fassade_west
      state: "off"
