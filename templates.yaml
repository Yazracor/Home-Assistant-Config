      attributes:
        source: "{{ trigger.event.data.source }}"
        destination: "{{ trigger.event.data.destination }}"
        payload: "{{ trigger.event.data.data | default(trigger.event.data.payload, true) }}"
        direction: "{{ trigger.event.data.direction }}"

- trigger:
    - platform: homeassistant
      event: start
      id: init
    - platform: event
      event_type: event_template_reloaded
      id: init
    - platform: event
      event_type: knx_event
      id: knx
  condition:
    - condition: template
      value_template: >-
        {% if trigger.id == 'init' %}
          {{ true }}
        {% else %}
        {% set address = trigger.event.data.destination | string %}
        {% set source = trigger.event.data.source | string %}
        {% set direction = trigger.event.data.direction | string %}
        {% set ignored_sources = ['15.15.250', '1.1.15'] %}
        {% set indoor_addresses = [
          '2/0/0', '2/0/2', '2/0/4', '2/0/6', '2/0/10', '2/0/12',
          '2/0/14', '2/0/18', '2/0/20', '2/0/24', '2/0/26', '2/0/28',
          '2/1/4', '2/1/6', '2/1/8', '2/1/12', '2/1/14', '2/2/0',
          '3/0/0', '3/0/2', '3/0/6', '3/0/8', '3/0/12', '3/0/14',
          '3/0/24', '3/0/26', '3/0/30', '3/0/32', '3/0/36', '3/0/38',
          '3/0/48', '3/0/50', '3/0/54', '3/0/56', '3/0/60', '3/0/62',
          '3/1/0', '3/1/2', '3/1/6', '3/1/8', '3/1/12', '3/1/14',
          '3/1/18', '3/1/20', '3/1/26', '3/1/28'
        ] %}
        {% set cover_addresses = [
          '4/0/0', '4/0/1', '4/0/4', '4/0/5', '4/0/8', '4/0/9',
          '4/0/12', '4/0/13', '4/0/48', '4/0/49', '4/0/52', '4/0/53',
          '4/0/56', '4/0/57', '4/0/60', '4/0/61', '4/0/64', '4/0/65',
          '4/0/68', '4/0/69', '4/0/72', '4/0/73', '4/0/76', '4/0/77',
          '4/0/80', '4/0/81', '4/0/84', '4/0/85', '4/0/88', '4/0/89',
          '4/0/94', '4/0/95', '4/1/20', '4/1/21', '4/2/0', '4/2/1',
          '4/2/2', '4/2/3', '4/2/6', '4/2/7', '4/2/8', '4/2/9',
          '4/2/14', '4/2/15'
        ] %}
        {{
          direction == 'Incoming'
          and source not in ignored_sources
          and address in indoor_addresses + cover_addresses
        }}
        {% endif %}
  sensor:
    - name: "KNX Schalter letzte Bedienung"
      unique_id: knx_schalter_letzte_bedienung
      state: >-
        {{ '1970-01-01T00:00:00+00:00' if trigger.id == 'init' else now().isoformat() }}
      attributes:
        last_address: >-
          {{ '' if trigger.id == 'init' else trigger.event.data.destination }}
        last_source: >-
          {{ '' if trigger.id == 'init' else trigger.event.data.source }}
        last_payload: >-
          {{ '' if trigger.id == 'init' else trigger.event.data.data }}

- trigger:
    - platform: homeassistant
      event: start
      id: init
    - platform: event
      event_type: event_template_reloaded
      id: init
    - platform: event
      event_type: homekit_state_change
      id: homekit
    - platform: event
      event_type: call_service
      id: service
  condition:
    - condition: template
      value_template: >-
        {% if trigger.id == 'init' %}
          {{ true }}
        {% else %}
        {% set event_type = trigger.event.event_type %}
        {% set data = trigger.event.data %}
        {% if event_type == 'homekit_state_change' %}
          {{ data.entity_id is string and data.entity_id.split('.')[0] in ['light', 'cover'] }}
        {% else %}
          {{
            trigger.event.context.user_id is not none
            and data.domain in ['light', 'cover']
          }}
        {% endif %}
        {% endif %}
  sensor:
    - name: "HA Bedienung letzte Bedienung"
      unique_id: ha_bedienung_letzte_bedienung
      state: >-
        {{ '1970-01-01T00:00:00+00:00' if trigger.id == 'init' else now().isoformat() }}
      attributes:
        event_type: "{{ '' if trigger.id == 'init' else trigger.event.event_type }}"
        entity_id: >-
          {% if trigger.id == 'init' %}
            {{ '' }}
          {% elif trigger.event.event_type == 'homekit_state_change' %}
            {{ trigger.event.data.entity_id }}
          {% else %}
            {{ trigger.event.data.service_data.entity_id | default('', true) }}
          {% endif %}
        service: >-
          {% if trigger.id == 'init' %}
            {{ '' }}
          {% elif trigger.event.event_type == 'homekit_state_change' %}
            {{ trigger.event.data.service }}
          {% else %}
            {{ trigger.event.data.domain }}.{{ trigger.event.data.service }}
          {% endif %}
        user_id: "{{ '' if trigger.id == 'init' else trigger.event.context.user_id }}"
        parent_id: "{{ '' if trigger.id == 'init' else trigger.event.context.parent_id }}"

- binary_sensor:
    - name: "Wetterstation Tag"
      unique_id: wetterstation_tag
      state: "{{ is_state('sun.sun', 'above_horizon') }}"
      attributes:
        source: sun.sun
        helligkeit: "{{ states('sensor.aussenbereich_wetterstation_helligkeit') }}"
        daemmerung: "{{ states('sensor.aussenbereich_wetterstation_daemmerung') }}"

    - name: "Person zuhause"
      unique_id: person_zuhause
      device_class: occupancy
      state: >-
        {{
          is_state('person.torben', 'home')
          or is_state('person.julia', 'home')
          or is_state('person.sinja', 'home')
          or is_state('person.silas', 'home')
        }}
      attributes:
        torben: "{{ states('person.torben') }}"
        julia: "{{ states('person.julia') }}"
        sinja: "{{ states('person.sinja') }}"
        silas: "{{ states('person.silas') }}"

    - name: "Präsenz"
      unique_id: praesenz
      device_class: occupancy
      state: >-
        {{
          is_state('binary_sensor.person_zuhause', 'on')
          or is_state('binary_sensor.haushaltshilfe_anwesend', 'on')
          or is_state('binary_sensor.gast_im_haus', 'on')
          or is_state('binary_sensor.manuelle_bedienung_aktiv', 'on')
        }}
      attributes:
        person_zuhause: "{{ states('binary_sensor.person_zuhause') }}"
        haushaltshilfe: "{{ states('binary_sensor.haushaltshilfe_anwesend') }}"
        gast_im_haus: "{{ states('binary_sensor.gast_im_haus') }}"
        manuelle_bedienung_aktiv: "{{ states('binary_sensor.manuelle_bedienung_aktiv') }}"

    - name: "Manuelle Bedienung aktiv"
      unique_id: manuelle_bedienung_aktiv
      device_class: occupancy
      state: >-
        {% set current_ts = now() | as_timestamp %}
        {% set values = [
          states('sensor.knx_schalter_letzte_bedienung'),
          states('sensor.ha_bedienung_letzte_bedienung')
        ] %}
        {% set ns = namespace(last_ts=0) %}
        {% for value in values %}
          {% set ts = value | as_timestamp(0) %}
          {% if ts > ns.last_ts %}
            {% set ns.last_ts = ts %}
          {% endif %}
        {% endfor %}
        {% set hour = now().hour %}
        {% set window_hours = 6 if hour >= 22 or hour < 7 else 2 %}
        {{ ns.last_ts > 0 and current_ts - ns.last_ts < window_hours * 3600 }}
      attributes:
        nachlauf_stunden: "{{ 6 if now().hour >= 22 or now().hour < 7 else 2 }}"
        nachtmodus: "{{ now().hour >= 22 or now().hour < 7 }}"
        letzte_knx_bedienung: "{{ states('sensor.knx_schalter_letzte_bedienung') }}"
        letzte_ha_bedienung: "{{ states('sensor.ha_bedienung_letzte_bedienung') }}"
        letzte_bedienung: >-
          {% set values = [
            states('sensor.knx_schalter_letzte_bedienung'),
            states('sensor.ha_bedienung_letzte_bedienung')
          ] %}
          {% set ns = namespace(last=none) %}
          {% for value in values %}
            {% set dt = value | as_datetime %}
            {% if dt is not none and (ns.last is none or dt > ns.last) %}
              {% set ns.last = dt %}
            {% endif %}
          {% endfor %}
          {{ ns.last.isoformat() if ns.last is not none else '' }}

    - name: "Gast im Haus"
      unique_id: gast_im_haus
      device_class: occupancy
      state: >-
        {% set bekannte_accounts = ['torben', 'julia', 'sinja', 'silas', 'aleksandramorawska'] %}
        {% set ns = namespace(found=false) %}
        {% for sensor in states.binary_sensor %}
          {% set object_id = sensor.entity_id.split('.', 1)[1] %}
          {% set account = object_id.rsplit('_wlan', 1)[0].split('_', 1)[0] %}
          {% if object_id.endswith('_wlan') and account not in bekannte_accounts and sensor.state == 'on' %}
            {% set ns.found = true %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}
      attributes:
        aktive_gaeste: >-
          {% set bekannte_accounts = ['torben', 'julia', 'sinja', 'silas', 'aleksandramorawska'] %}
          {% set ns = namespace(active=[]) %}
          {% for sensor in states.binary_sensor %}
            {% set object_id = sensor.entity_id.split('.', 1)[1] %}
            {% set account = object_id.rsplit('_wlan', 1)[0].split('_', 1)[0] %}
            {% if object_id.endswith('_wlan') and account not in bekannte_accounts and sensor.state == 'on' %}
              {% set ns.active = ns.active + [sensor.name] %}
            {% endif %}
          {% endfor %}
          {{ ns.active }}
        ausgeschlossene_radius_accounts: torben, julia, sinja, silas, aleksandramorawska

    - name: "Haushaltshilfe anwesend"
      unique_id: haushaltshilfe_anwesend
      delay_off:
        minutes: 45
      state: >-
        {{
          is_state('binary_sensor.aleksandramorawska_aleksandramorawska_wlan', 'on')
          or is_state('binary_sensor.radius_presence_aleksandramorawska', 'on')
        }}
      attributes:
        source_entity: binary_sensor.aleksandramorawska_aleksandramorawska_wlan
        legacy_source_entity: binary_sensor.radius_presence_aleksandramorawska

    - name: "Hitzeschutz Fassade West"
      unique_id: hitzeschutz_fassade_west
      delay_on:
        minutes: 5
      delay_off:
        minutes: 5
      state: >-
        {% set lux = states('sensor.aussenbereich_wetterstation_helligkeit') | float(0) %}
        {% set outside_temp = states('sensor.aussenbereich_wetterstation_temperatur') | float(0) %}
        {% set azimuth = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set elevation = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set temp_threshold = 10000 if outside_temp >= 23 else 15000 if outside_temp >= 15 else 20000 if outside_temp >= 5 else 24000 %}
        {% set elevation_factor = 0.8 if elevation > 60 else 1 %}
        {% set delta = (((azimuth - 270 + 180) % 360) - 180) | abs %}
        {% set load = lux * ([0, 1 - (delta / 90)] | max) * elevation_factor %}
        {{ is_state('sun.sun', 'above_horizon') and elevation > 8 and lux > 25000 and delta < 90 and load > temp_threshold }}
      attributes:
        facade_azimuth: 270

    - name: "Hitzeschutz Fassade Ost"
      unique_id: hitzeschutz_fassade_ost
      delay_on:
        minutes: 5
      delay_off:
        minutes: 5
      state: >-
        {% set lux = states('sensor.aussenbereich_wetterstation_helligkeit') | float(0) %}
        {% set outside_temp = states('sensor.aussenbereich_wetterstation_temperatur') | float(0) %}
        {% set azimuth = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set elevation = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set temp_threshold = 10000 if outside_temp >= 23 else 15000 if outside_temp >= 15 else 20000 if outside_temp >= 5 else 24000 %}
        {% set elevation_factor = 0.8 if elevation > 60 else 1 %}
        {% set delta = (((azimuth - 100 + 180) % 360) - 180) | abs %}
        {% set load = lux * ([0, 1 - (delta / 90)] | max) * elevation_factor %}
        {{ is_state('sun.sun', 'above_horizon') and elevation > 8 and lux > 25000 and delta < 80 and load > temp_threshold + 4000 }}
      attributes:
        facade_azimuth: 100

    - name: "Hitzeschutz Fassade Süd"
      unique_id: hitzeschutz_fassade_sued
      delay_on:
        minutes: 5
      delay_off:
        minutes: 5
      state: >-
        {% set lux = states('sensor.aussenbereich_wetterstation_helligkeit') | float(0) %}
        {% set outside_temp = states('sensor.aussenbereich_wetterstation_temperatur') | float(0) %}
        {% set azimuth = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set elevation = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set temp_threshold = 10000 if outside_temp >= 23 else 15000 if outside_temp >= 15 else 20000 if outside_temp >= 5 else 24000 %}
        {% set elevation_factor = 0.8 if elevation > 60 else 1 %}
        {% set delta = (((azimuth - 180 + 180) % 360) - 180) | abs %}
        {% set load = lux * ([0, 1 - (delta / 90)] | max) * elevation_factor %}
        {{ is_state('sun.sun', 'above_horizon') and elevation > 8 and lux > 25000 and delta < 90 and load > temp_threshold + 3000 }}
      attributes:
        facade_azimuth: 180

    - name: "Hitzeschutz Fassade Nord"
      unique_id: hitzeschutz_fassade_nord
      delay_on:
        minutes: 5
      delay_off:
        minutes: 5
      state: >-
        {% set lux = states('sensor.aussenbereich_wetterstation_helligkeit') | float(0) %}
        {% set outside_temp = states('sensor.aussenbereich_wetterstation_temperatur') | float(0) %}
        {% set azimuth = state_attr('sun.sun', 'azimuth') | float(0) %}
        {% set elevation = state_attr('sun.sun', 'elevation') | float(0) %}
        {% set temp_threshold = 10000 if outside_temp >= 23 else 15000 if outside_temp >= 15 else 20000 if outside_temp >= 5 else 24000 %}
        {% set elevation_factor = 0.8 if elevation > 60 else 1 %}
        {% set delta = (((azimuth - 0 + 180) % 360) - 180) | abs %}
        {% set load = lux * ([0, 1 - (delta / 90)] | max) * elevation_factor %}
        {{ is_state('sun.sun', 'above_horizon') and elevation > 8 and lux > 35000 and delta < 45 and load > temp_threshold + 10000 }}
      attributes:
        facade_azimuth: 0
