- trigger:
    - platform: homeassistant
      event: start
      id: init
    - platform: event
      event_type: event_template_reloaded
      id: init
    - platform: event
      event_type: hitzeschutz_manual_block_reset
      id: reset
    - platform: event
      event_type: knx_event
      id: knx
    - platform: event
      event_type: homekit_state_change
      id: homekit
    - platform: event
      event_type: call_service
      id: service
  condition:
    - condition: template
      value_template: >-
        {% if trigger.id in ['init', 'reset'] %}
          {{ true }}
        {% else %}
          {% from 'hitzeschutz_manual_generated.jinja' import knx_cover_map %}
          {% from 'manual_control.jinja' import touched_entities %}
          {% set knx_cover_map = knx_cover_map | as_function %}
          {% set touched_entities = touched_entities | as_function %}
          {% set cover_entities = states.cover | map(attribute='entity_id') | reject('eq', 'cover.aussenbereich_garage_garagentor') | list %}
          {{
            is_state('input_boolean.hitzeschutz_automatik_fahrbefehl_aktiv', 'off')
            and touched_entities(trigger.id, trigger.event.data, trigger.event.context.user_id, cover_entities, knx_cover_map(), 'cover', false) | count > 0
          }}
        {% endif %}
  sensor:
    - name: "Hitzeschutz Manueller Jalousie-Block"
      unique_id: hitzeschutz_manueller_jalousie_block
      state: >-
        {% if trigger.id == 'init' %}
          {{ this.state | default('1970-01-01T00:00:00+00:00', true) }}
        {% else %}
          {{ now().isoformat() }}
        {% endif %}
      attributes:
        blocked_since: >-
          {% set previous = this.attributes.blocked_since | default({}, true) %}
          {% if trigger.id == 'init' %}
            {{ previous | to_json }}
          {% elif trigger.id == 'reset' %}
            {{ {} | to_json }}
          {% else %}
            {% from 'hitzeschutz_manual_generated.jinja' import knx_cover_map %}
            {% from 'manual_control.jinja' import touched_entities %}
            {% set knx_cover_map = knx_cover_map | as_function %}
            {% set touched_entities = touched_entities | as_function %}
            {% set cover_entities = states.cover | map(attribute='entity_id') | reject('eq', 'cover.aussenbereich_garage_garagentor') | list %}
            {% set touched = touched_entities(trigger.id, trigger.event.data, trigger.event.context.user_id, cover_entities, knx_cover_map(), 'cover', false) %}
            {% set cutoff = (now() | as_timestamp) - 2 * 3600 %}
            {% set ns = namespace(entries=[]) %}
            {% for entity, timestamp in previous.items() if entity not in touched and timestamp | as_timestamp(0) >= cutoff %}
              {% set ns.entries = ns.entries + [(entity, timestamp)] %}
            {% endfor %}
            {% for entity in touched %}
              {% set ns.entries = ns.entries + [(entity, now().isoformat())] %}
            {% endfor %}
            {{ dict(ns.entries) | to_json }}
          {% endif %}

- trigger:
    - platform: event
      event_type: knx_event
  condition:
    - condition: template
      value_template: >-
        {% from 'knx_addresses.jinja' import indoor_addresses, cover_addresses %}
        {% set indoor_addresses = indoor_addresses | as_function %}
        {% set cover_addresses = cover_addresses | as_function %}
        {% set address = trigger.event.data.destination | string %}
        {% set direction = trigger.event.data.direction | string %}
        {{ direction == 'Incoming' and address in indoor_addresses() + cover_addresses() }}
  sensor:
    - name: "KNX Präsenzkandidat letztes Telegramm"
      unique_id: knx_praesenzkandidat_letztes_telegramm
      state: "{{ now().isoformat() }}"
      attributes:
        source: "{{ trigger.event.data.source }}"
        destination: "{{ trigger.event.data.destination }}"
        payload: "{{ trigger.event.data.data | default(trigger.event.data.payload, true) }}"
        direction: "{{ trigger.event.data.direction }}"

- trigger:
    - platform: homeassistant
      event: start
      id: init
    - platform: event
      event_type: event_template_reloaded
      id: init
    - platform: event
      event_type: knx_event
      id: knx
  condition:
    - condition: template
      value_template: >-
        {% if trigger.id == 'init' %}
          {{ true }}
        {% else %}
        {% from 'knx_addresses.jinja' import indoor_addresses, cover_addresses %}
        {% set indoor_addresses = indoor_addresses | as_function %}
        {% set cover_addresses = cover_addresses | as_function %}
        {% set address = trigger.event.data.destination | string %}
        {% set source = trigger.event.data.source | string %}
        {% set direction = trigger.event.data.direction | string %}
        {% set ignored_sources = ['15.15.250', '1.1.15'] %}
        {{
          direction == 'Incoming'
          and source not in ignored_sources
          and address in indoor_addresses() + cover_addresses()
        }}
        {% endif %}
  sensor:
    - name: "KNX Schalter letzte Bedienung"
      unique_id: knx_schalter_letzte_bedienung
      state: >-
        {{ '1970-01-01T00:00:00+00:00' if trigger.id == 'init' else now().isoformat() }}
      attributes:
        last_address: >-
          {{ '' if trigger.id == 'init' else trigger.event.data.destination }}
        last_source: >-
          {{ '' if trigger.id == 'init' else trigger.event.data.source }}
        last_payload: >-
          {{ '' if trigger.id == 'init' else trigger.event.data.data }}

- trigger:
    - platform: homeassistant
      event: start
      id: init
    - platform: event
      event_type: event_template_reloaded
      id: init
    - platform: event
      event_type: homekit_state_change
      id: homekit
    - platform: event
      event_type: call_service
      id: service
  condition:
    - condition: template
      value_template: >-
        {% if trigger.id == 'init' %}
          {{ true }}
        {% else %}
        {% set event_type = trigger.event.event_type %}
        {% set data = trigger.event.data %}
        {% if event_type == 'homekit_state_change' %}
          {{ data.entity_id is string and data.entity_id.split('.')[0] in ['light', 'cover'] }}
        {% else %}
          {{
            trigger.event.context.user_id is not none
            and data.domain in ['light', 'cover']
          }}
        {% endif %}
        {% endif %}
  sensor:
    - name: "HA Bedienung letzte Bedienung"
      unique_id: ha_bedienung_letzte_bedienung
      state: >-
        {{ '1970-01-01T00:00:00+00:00' if trigger.id == 'init' else now().isoformat() }}
      attributes:
        event_type: "{{ '' if trigger.id == 'init' else trigger.event.event_type }}"
        entity_id: >-
          {% if trigger.id == 'init' %}
            {{ '' }}
          {% elif trigger.event.event_type == 'homekit_state_change' %}
            {{ trigger.event.data.entity_id }}
          {% else %}
            {{ trigger.event.data.service_data.entity_id | default('', true) }}
          {% endif %}
        service: >-
          {% if trigger.id == 'init' %}
            {{ '' }}
          {% elif trigger.event.event_type == 'homekit_state_change' %}
            {{ trigger.event.data.service }}
          {% else %}
            {{ trigger.event.data.domain }}.{{ trigger.event.data.service }}
          {% endif %}
        user_id: "{{ '' if trigger.id == 'init' else trigger.event.context.user_id }}"
        parent_id: "{{ '' if trigger.id == 'init' else trigger.event.context.parent_id }}"

- binary_sensor:
    - name: "Wetterstation Tag"
      unique_id: wetterstation_tag
      state: "{{ is_state('sun.sun', 'above_horizon') }}"
      attributes:
        source: sun.sun
        helligkeit: "{{ states('sensor.aussenbereich_wetterstation_helligkeit') }}"
        daemmerung: "{{ states('sensor.aussenbereich_wetterstation_daemmerung') }}"

    - name: "Person zuhause"
      unique_id: person_zuhause
      device_class: occupancy
      state: >-
        {{
          is_state('person.torben', 'home')
          or is_state('person.julia', 'home')
          or is_state('person.sinja', 'home')
          or is_state('person.silas', 'home')
        }}
      attributes:
        torben: "{{ states('person.torben') }}"
        julia: "{{ states('person.julia') }}"
        sinja: "{{ states('person.sinja') }}"
        silas: "{{ states('person.silas') }}"

    - name: "Präsenz"
      unique_id: praesenz
      device_class: occupancy
      state: >-
        {{
          is_state('binary_sensor.person_zuhause', 'on')
          or is_state('binary_sensor.haushaltshilfe_anwesend', 'on')
          or is_state('binary_sensor.gast_im_haus', 'on')
          or is_state('binary_sensor.manuelle_bedienung_aktiv', 'on')
        }}
      attributes:
        person_zuhause: "{{ states('binary_sensor.person_zuhause') }}"
        haushaltshilfe: "{{ states('binary_sensor.haushaltshilfe_anwesend') }}"
        gast_im_haus: "{{ states('binary_sensor.gast_im_haus') }}"
        manuelle_bedienung_aktiv: "{{ states('binary_sensor.manuelle_bedienung_aktiv') }}"

    - name: "Manuelle Bedienung aktiv"
      unique_id: manuelle_bedienung_aktiv
      device_class: occupancy
      state: >-
        {% set current_ts = now() | as_timestamp %}
        {% set values = [
          states('sensor.knx_schalter_letzte_bedienung'),
          states('sensor.ha_bedienung_letzte_bedienung')
        ] %}
        {% set ns = namespace(last_ts=0) %}
        {% for value in values %}
          {% set ts = value | as_timestamp(0) %}
          {% if ts > ns.last_ts %}
            {% set ns.last_ts = ts %}
          {% endif %}
        {% endfor %}
        {% set hour = now().hour %}
        {% set window_hours = 6 if hour >= 22 or hour < 7 else 2 %}
        {{ ns.last_ts > 0 and current_ts - ns.last_ts < window_hours * 3600 }}
      attributes:
        nachlauf_stunden: "{{ 6 if now().hour >= 22 or now().hour < 7 else 2 }}"
        nachtmodus: "{{ now().hour >= 22 or now().hour < 7 }}"
        letzte_knx_bedienung: "{{ states('sensor.knx_schalter_letzte_bedienung') }}"
        letzte_ha_bedienung: "{{ states('sensor.ha_bedienung_letzte_bedienung') }}"
        letzte_bedienung: >-
          {% set values = [
            states('sensor.knx_schalter_letzte_bedienung'),
            states('sensor.ha_bedienung_letzte_bedienung')
          ] %}
          {% set ns = namespace(last=none) %}
          {% for value in values %}
            {% set dt = value | as_datetime %}
            {% if dt is not none and (ns.last is none or dt > ns.last) %}
              {% set ns.last = dt %}
            {% endif %}
          {% endfor %}
          {{ ns.last.isoformat() if ns.last is not none else '' }}

    - name: "Gast im Haus"
      unique_id: gast_im_haus
      device_class: occupancy
      state: >-
        {% from 'presence.jinja' import active_guest_names %}
        {% set active_guest_names = active_guest_names | as_function %}
        {{ active_guest_names() | count > 0 }}
      attributes:
        aktive_gaeste: >-
          {% from 'presence.jinja' import active_guest_names %}
          {% set active_guest_names = active_guest_names | as_function %}
          {{ active_guest_names() }}
        ausgeschlossene_radius_accounts: >-
          {% from 'presence.jinja' import excluded_radius_accounts %}
          {% set excluded_radius_accounts = excluded_radius_accounts | as_function %}
          {{ excluded_radius_accounts() | join(', ') }}

    - name: "Haushaltshilfe anwesend"
      unique_id: haushaltshilfe_anwesend
      delay_off:
        minutes: 45
      state: >-
        {{
          is_state('binary_sensor.aleksandramorawska_aleksandramorawska_wlan', 'on')
          or is_state('binary_sensor.radius_presence_aleksandramorawska', 'on')
        }}
      attributes:
        source_entity: binary_sensor.aleksandramorawska_aleksandramorawska_wlan
        legacy_source_entity: binary_sensor.radius_presence_aleksandramorawska

    - name: "Hitzeschutz Fassade West"
      unique_id: hitzeschutz_fassade_west
      state: >-
        {% from 'heat_protection.jinja' import facade_active %}
        {% set facade_active = facade_active | as_function %}
        {{ facade_active('west') }}
      attributes:
        facade_azimuth: >-
          {% from 'heat_protection.jinja' import facade_azimuth %}
          {% set facade_azimuth = facade_azimuth | as_function %}
          {{ facade_azimuth('west') }}
        estimated_sun_lux: &hitzeschutz_estimated_sun_lux >-
          {% from 'heat_protection.jinja' import sun_lux %}
          {% set sun_lux = sun_lux | as_function %}
          {{ sun_lux() | round(0) }}

    - name: "Hitzeschutz Sonnensegel"
      unique_id: hitzeschutz_sonnensegel
      state: >-
        {% from 'heat_protection.jinja' import facade_active %}
        {% set facade_active = facade_active | as_function %}
        {{ facade_active('sonnensegel') }}
      attributes:
        facade_azimuth: >-
          {% from 'heat_protection.jinja' import facade_azimuth %}
          {% set facade_azimuth = facade_azimuth | as_function %}
          {{ facade_azimuth('sonnensegel') }}
        floor_shadow_axis_azimuth: 205
        south_wall_axis_azimuth: 205
        west_wall_axis_azimuth: 295
        estimated_sun_lux: *hitzeschutz_estimated_sun_lux
        shadow_coverage: >-
          {% from 'heat_protection.jinja' import horizontal_shade_coverage %}
          {% set horizontal_shade_coverage = horizontal_shade_coverage | as_function %}
          {{ (horizontal_shade_coverage('sonnensegel') * 100) | round(1) }}
        floor_shadow_coverage: >-
          {% from 'heat_protection.jinja' import floor_shadow_coverage %}
          {% set floor_shadow_coverage = floor_shadow_coverage | as_function %}
          {{ (floor_shadow_coverage('sonnensegel') * 100) | round(1) }}
        south_wall_shadow_coverage: >-
          {% from 'heat_protection.jinja' import wall_shadow_coverage %}
          {% set wall_shadow_coverage = wall_shadow_coverage | as_function %}
          {{ (wall_shadow_coverage('sonnensegel', 205) * 100) | round(1) }}
        west_wall_shadow_coverage: >-
          {% from 'heat_protection.jinja' import wall_shadow_coverage %}
          {% set wall_shadow_coverage = wall_shadow_coverage | as_function %}
          {{ (wall_shadow_coverage('sonnensegel', 295) * 100) | round(1) }}

    - name: "Hitzeschutz Fassade Wohnzimmer Panorama"
      unique_id: hitzeschutz_fassade_wohnzimmer_panorama
      state: >-
        {% from 'heat_protection.jinja' import facade_active %}
        {% set facade_active = facade_active | as_function %}
        {{ facade_active('wohnzimmer_panorama') }}
      attributes:
        facade_azimuth: >-
          {% from 'heat_protection.jinja' import facade_azimuth %}
          {% set facade_azimuth = facade_azimuth | as_function %}
          {{ facade_azimuth('wohnzimmer_panorama') }}
        estimated_sun_lux: *hitzeschutz_estimated_sun_lux

    - name: "Hitzeschutz Fassade Ost"
      unique_id: hitzeschutz_fassade_ost
      state: >-
        {% from 'heat_protection.jinja' import facade_active %}
        {% set facade_active = facade_active | as_function %}
        {{ facade_active('ost') }}
      attributes:
        facade_azimuth: >-
          {% from 'heat_protection.jinja' import facade_azimuth %}
          {% set facade_azimuth = facade_azimuth | as_function %}
          {{ facade_azimuth('ost') }}
        estimated_sun_lux: *hitzeschutz_estimated_sun_lux

    - name: "Hitzeschutz Fassade Süd"
      unique_id: hitzeschutz_fassade_sued
      state: >-
        {% from 'heat_protection.jinja' import facade_active %}
        {% set facade_active = facade_active | as_function %}
        {{ facade_active('sued') }}
      attributes:
        facade_azimuth: >-
          {% from 'heat_protection.jinja' import facade_azimuth %}
          {% set facade_azimuth = facade_azimuth | as_function %}
          {{ facade_azimuth('sued') }}
        estimated_sun_lux: *hitzeschutz_estimated_sun_lux

    - name: "Hitzeschutz Fassade Nord"
      unique_id: hitzeschutz_fassade_nord
      state: >-
        {% from 'heat_protection.jinja' import facade_active %}
        {% set facade_active = facade_active | as_function %}
        {{ facade_active('nord') }}
      attributes:
        facade_azimuth: >-
          {% from 'heat_protection.jinja' import facade_azimuth %}
          {% set facade_azimuth = facade_azimuth | as_function %}
          {{ facade_azimuth('nord') }}
        estimated_sun_lux: *hitzeschutz_estimated_sun_lux
