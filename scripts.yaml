hitzeschutz_jalousie_automatisieren:
  alias: Hitzeschutz Jalousie automatisieren
  mode: queued
  max: 100
  fields:
    cover_entity:
      required: true
      selector:
        entity:
          domain: cover
    action_id:
      required: true
      selector:
        select:
          options:
            - close
            - open
  sequence:
    - variables:
        result: >-
          {% from 'cover_control.jinja' import cover_automation_status %}
          {% set status = cover_automation_status | as_function %}
          {% set decision = status(
            cover_entity, action_id,
            allow_automation | default(true),
            respect_automation_switch | default(true),
            require_automation_marker | default(true),
            ignore_manual_cooldown | default(false),
            respect_living_room_tv | default(true),
            expected_mode | default(none)
          ) %}
          {{ dict(decision, performed=false) }}
    - if:
        - condition: template
          value_template: "{{ result.allowed }}"
      then:
        - action: "{{ 'cover.close_cover' if action_id == 'close' else 'cover.open_cover' }}"
          target:
            entity_id: "{{ cover_entity }}"
        - variables:
            result: "{{ dict(result, performed=true) }}"
    - stop: Jalousie geprueft
      response_variable: result

adaptive_helligkeit_lichter_anpassen:
  alias: Adaptive Helligkeit Lichter anpassen
  mode: single
  sequence:
    - variables:
        lux: "{{ states('sensor.aussenbereich_wetterstation_helligkeit') | float(0) }}"
        target_pct_of_max: >-
          {% if lux < 1000 %}
            100
          {% elif lux < 5000 %}
            85
          {% elif lux < 15000 %}
            70
          {% elif lux < 30000 %}
            55
          {% else %}
            40
          {% endif %}
        target_lights: "{{ expand('group.adaptive_helligkeit_lichter') | map(attribute='entity_id') | list }}"
        night_override_active: "{{ is_state('switch.schlafmodus', 'on') }}"
    - repeat:
        for_each: "{{ target_lights }}"
        sequence:
          - variables:
              light_entity: "{{ repeat.item }}"
              manual_helper: >-
                {% from 'adaptive_lighting.jinja' import manual_helper %}
                {% set manual_helper = manual_helper | as_function %}
                {{ manual_helper(repeat.item) }}
              manual_cooldown_active: >-
                {% set last_ts = states(manual_helper) | as_timestamp(0) %}
                {{ last_ts > 0 and (now() | as_timestamp) - last_ts < 2 * 3600 }}
              light_target_brightness: >-
                {% set caps = {
                  'light.og_schlafzimmer_decke': 77,
                  'light.og_bad_decke': 178,
                  'light.og_flur_decke': 255,
                  'light.eg_flur_decke': 255,
                  'light.eg_arbeitszimmer_decke': 255,
                  'light.eg_wohnzimmer_decke_mitte': 102,
                  'light.eg_wohnzimmer_decke_seiten': 102
                } %}
                {% set max_brightness = caps.get(repeat.item, 255) %}
                {{ (max_brightness * target_pct_of_max | int(0) / 100) | round(0) | int }}
              brightness_delta: "{{ (light_target_brightness | int(0) - state_attr(repeat.item, 'brightness') | int(0)) | abs }}"
              night_dim_lights:
                - light.eg_arbeitszimmer_decke
                - light.og_flur_decke
                - light.og_bad_decke
          - if:
              - condition: template
                value_template: >-
                  {{
                    is_state(light_entity, 'on')
                    and not (night_override_active and light_entity in night_dim_lights)
                    and not manual_cooldown_active
                    and brightness_delta | int(0) >= 20
                  }}
            then:
              - action: light.turn_on
                target:
                  entity_id: "{{ light_entity }}"
                data:
                  brightness: "{{ light_target_brightness | int }}"

adaptive_helligkeit_nachtlicht_dimmen:
  alias: Adaptive Helligkeit Nachtlicht dimmen
  mode: parallel
  fields:
    light_entity:
      required: true
      selector:
        entity:
          domain: light
  sequence:
    - variables:
        manual_helper: >-
          {% from 'adaptive_lighting.jinja' import manual_helper %}
          {% set manual_helper = manual_helper | as_function %}
          {{ manual_helper(light_entity) }}
        manual_cooldown_active: >-
          {% set last_ts = states(manual_helper) | as_timestamp(0) %}
          {{ last_ts > 0 and (now() | as_timestamp) - last_ts < 2 * 3600 }}
    - if:
        - condition: template
          value_template: >-
            {{
              is_state(light_entity, 'on')
              and not manual_cooldown_active
            }}
      then:
        - action: light.turn_on
          target:
            entity_id: "{{ light_entity }}"
          data:
            brightness: 5

hitzeschutz_jalousien_sammel_benachrichtigen:
  alias: Hitzeschutz Jalousien gesammelt benachrichtigen
  mode: parallel
  fields:
    notification_payload:
      required: true
      selector:
        object:
  sequence:
    - variables:
        payload: "{{ notification_payload | from_json if notification_payload is string else notification_payload }}"
        summaries: "{{ payload['summaries'] }}"
        details: "{{ payload['details'] }}"
        lux: "{{ states('sensor.aussenbereich_wetterstation_helligkeit') | float(0) }}"
        outside_temp: "{{ states('sensor.aussenbereich_wetterstation_temperatur') | float(0) }}"
        azimuth: "{{ state_attr('sun.sun', 'azimuth') | float(0) }}"
        elevation: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
    - action: notify.mobile_app_torbens_iphone
      metadata: {}
      data:
        title: "Jalousien: Hitzeschutz"
        message: >-
          Hitzeschutz: {{ summaries | join(', ') }}
          {{ details | join('\n') }}

          Helligkeit: {{ lux | round(0) }} lx, aussen: {{ outside_temp | round(1) }} °C,
          Sonne: {{ elevation | round(1) }}° / {{ azimuth | round(0) }}°.
        data:
          push:
            sound:
              name: default

hitzeschutz_jalousien_checks_pruefen:
  alias: Hitzeschutz Jalousien Checks pruefen
  mode: parallel
  fields:
    checks:
      required: true
      selector:
        object:
  sequence:
    - variables:
        check_items: "{{ checks | from_json if checks is string else checks }}"
        expected_mode: "{{ states('binary_sensor.heizen_kuehlen_rueckmeldung') }}"
        summaries: []
        details: []
    - repeat:
        for_each: "{{ check_items }}"
        sequence:
          - variables:
              check: "{{ repeat.item }}"
          - repeat:
              for_each: "{{ check.cover_entities }}"
              sequence:
                - action: script.hitzeschutz_jalousie_automatisieren
                  data:
                    cover_entity: "{{ repeat.item }}"
                    action_id: "{{ check.action_id }}"
                    expected_mode: "{{ expected_mode }}"
                    allow_automation: "{{ check.allow_automation | default(true) }}"
                    respect_automation_switch: "{{ check.respect_automation_switch | default(true) }}"
                    require_automation_marker: "{{ check.require_automation_marker | default(true) }}"
                    ignore_manual_cooldown: "{{ check.ignore_manual_cooldown | default(false) }}"
                    respect_living_room_tv: "{{ check.respect_living_room_tv | default(true) }}"
                  response_variable: outcome
                - if:
                    - condition: template
                      value_template: >-
                        {{ outcome.performed or (
                          outcome.needs_change
                          and 'thermische Freigabe fehlt' not in outcome.reasons
                          and 'Jalousie faehrt bereits' not in outcome.reasons
                        ) }}
                  then:
                    - variables:
                        label: "{{ check.facade_display_name | default(check.facade_name, true) }}"
                        summaries: "{{ (summaries + [label]) | unique | list }}"
                        details: >-
                          {% set name = state_attr(repeat.item, 'friendly_name') | default(repeat.item, true) %}
                          {% set action_text = 'Schliessen' if check.action_id == 'close' else 'Oeffnen' %}
                          {% set result_text = 'ausgeloest' if outcome.performed else 'nicht ausgeloest: ' ~ (outcome.reasons | join(', ')) %}
                          {{ details + ['- ' ~ label ~ ': ' ~ name ~ ' ' ~ action_text ~ ' ' ~ result_text] }}
    - if:
        - condition: template
          value_template: "{{ details | count > 0 }}"
      then:
        - action: script.hitzeschutz_jalousien_sammel_benachrichtigen
          data:
            notification_payload: "{{ {'summaries': summaries, 'details': details} }}"

hitzeschutz_jalousien_fassadenstatus_pruefen:
  alias: Hitzeschutz Jalousien Fassadenstatus pruefen
  mode: parallel
  fields:
    facade_state:
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"
    action_id:
      required: true
      selector:
        select:
          options:
            - close
            - open
    allow_automation:
      required: false
      default: false
      selector:
        boolean:
    respect_automation_switch:
      required: false
      default: true
      selector:
        boolean:
    require_automation_marker:
      required: false
      default: true
      selector:
        boolean:
    ignore_manual_cooldown:
      required: false
      default: false
      selector:
        boolean:
    respect_living_room_tv:
      required: false
      default: true
      selector:
        boolean:
    min_facade_state_seconds:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 86400
          mode: box
    use_direct_facade_calculation:
      required: false
      default: false
      selector:
        boolean:
  sequence:
    - variables:
        checks: >-
          {% from 'heat_protection.jinja' import facade_active, facade_configs %}
          {% set facade_active = facade_active | as_function %}
          {% set facade_configs = facade_configs | as_function %}
          {% set ns = namespace(checks=[]) %}
          {% set min_state_seconds = min_facade_state_seconds | default(0) | int(0) %}
          {% for facade_key, facade in facade_configs().items() %}
            {% set direct_active = facade_active(facade_key) %}
            {% set active = direct_active if use_direct_facade_calculation | default(false) else is_state(facade.sensor, 'on') %}
            {% set state_matches = (facade_state == 'on' and active) or (facade_state == 'off' and not active) %}
            {% set facade_state_age = (now() | as_timestamp) - (states[facade.sensor].last_changed | as_timestamp(0)) %}
            {% set state_age_ok = min_state_seconds <= 0 or (not use_direct_facade_calculation | default(false) and facade_state_age >= min_state_seconds) %}
            {% if state_matches and state_age_ok %}
              {% set ns.checks = ns.checks + [{
                'facade_name': facade.name,
                'facade_display_name': facade.display_name,
                'action_id': action_id,
                'cover_entities': facade.covers,
                'allow_automation': allow_automation | default(false),
                'respect_automation_switch': respect_automation_switch | default(true),
                'require_automation_marker': require_automation_marker | default(true),
                'ignore_manual_cooldown': ignore_manual_cooldown | default(false),
                'respect_living_room_tv': respect_living_room_tv | default(true)
              }] %}
            {% endif %}
          {% endfor %}
          {{ ns.checks | to_json }}
    - action: script.hitzeschutz_jalousien_checks_pruefen
      data:
        checks: "{{ checks }}"

hitzeschutz_manuellen_jalousie_block_zuruecksetzen:
  alias: Hitzeschutz manuellen Jalousie-Block zuruecksetzen
  mode: single
  sequence:
    - event: hitzeschutz_manual_block_reset

auto_jalousien:
  alias: Auto Jalousien
  icon: mdi:blinds-horizontal
  mode: single
  sequence:
    - action: script.hitzeschutz_manuellen_jalousie_block_zuruecksetzen
    - action: homeassistant.update_entity
      target:
        entity_id:
          - binary_sensor.hitzeschutz_fassade_west
          - binary_sensor.hitzeschutz_fassade_wohnzimmer_panorama
          - binary_sensor.hitzeschutz_sonnensegel
          - binary_sensor.hitzeschutz_fassade_ost
          - binary_sensor.hitzeschutz_fassade_sud
          - binary_sensor.hitzeschutz_fassade_nord
    - action: script.hitzeschutz_jalousien_fassadenstatus_pruefen
      data:
        facade_state: "on"
        action_id: close
        allow_automation: true
        respect_automation_switch: false
        require_automation_marker: false
        ignore_manual_cooldown: true
        respect_living_room_tv: false
    - action: script.hitzeschutz_jalousien_fassadenstatus_pruefen
      data:
        facade_state: "off"
        action_id: open
        allow_automation: true
        respect_automation_switch: false
        require_automation_marker: false
        ignore_manual_cooldown: true
        respect_living_room_tv: false

hitzeschutz_jalousie_fassade_pruefen:
  alias: Hitzeschutz Jalousie Fassade pruefen
  mode: parallel
  fields:
    facade_name:
      required: true
      selector:
        text:
    action_id:
      required: true
      selector:
        select:
          options:
            - close
            - open
    cover_entities:
      required: true
      selector:
        object:
    allow_automation:
      required: false
      default: true
      selector:
        boolean:
    respect_automation_switch:
      required: false
      default: true
      selector:
        boolean:
    require_automation_marker:
      required: false
      default: true
      selector:
        boolean:
    ignore_manual_cooldown:
      required: false
      default: false
      selector:
        boolean:
    respect_living_room_tv:
      required: false
      default: true
      selector:
        boolean:
  sequence:
    - action: script.hitzeschutz_jalousien_checks_pruefen
      data:
        checks: >-
          {{ [{
            'facade_name': facade_name,
            'action_id': action_id,
            'cover_entities': cover_entities,
            'allow_automation': allow_automation | default(true),
            'respect_automation_switch': respect_automation_switch | default(true),
            'require_automation_marker': require_automation_marker | default(true),
            'ignore_manual_cooldown': ignore_manual_cooldown | default(false),
            'respect_living_room_tv': respect_living_room_tv | default(true)
          }] }}
