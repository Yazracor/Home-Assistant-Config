hitzeschutz_jalousie_automatisieren:
  alias: Hitzeschutz Jalousie automatisieren
  mode: parallel
  fields:
    cover_entity:
      required: true
      selector:
        entity:
          domain: cover
    action_id:
      required: true
      selector:
        select:
          options:
            - close
            - open
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.hitzeschutz_automatik_fahrbefehl_aktiv
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ action_id == 'close' }}"
          sequence:
            - action: cover.close_cover
              continue_on_error: true
              target:
                entity_id: "{{ cover_entity }}"
        - conditions:
            - condition: template
              value_template: "{{ action_id == 'open' }}"
          sequence:
            - action: cover.open_cover
              continue_on_error: true
              target:
                entity_id: "{{ cover_entity }}"
      default:
        - action: persistent_notification.create
          data:
            title: "Hitzeschutz: unbekannte Aktion"
            message: "Unbekannte Aktion '{{ action_id }}' fuer {{ cover_entity }}."
    - delay:
        seconds: 5
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.hitzeschutz_automatik_fahrbefehl_aktiv

adaptive_helligkeit_lichter_anpassen:
  alias: Adaptive Helligkeit Lichter anpassen
  mode: single
  sequence:
    - variables:
        lux: "{{ states('sensor.aussenbereich_wetterstation_helligkeit') | float(0) }}"
        target_pct_of_max: >-
          {% if lux < 1000 %}
            100
          {% elif lux < 5000 %}
            85
          {% elif lux < 15000 %}
            70
          {% elif lux < 30000 %}
            55
          {% else %}
            40
          {% endif %}
        target_lights: "{{ expand('group.adaptive_helligkeit_lichter') | map(attribute='entity_id') | list }}"
        night_override_active: "{{ is_state('switch.schlafmodus', 'on') }}"
    - repeat:
        for_each: "{{ target_lights }}"
        sequence:
          - variables:
              light_entity: "{{ repeat.item }}"
              manual_helper: >-
                {% from 'adaptive_lighting.jinja' import manual_helper %}
                {% set manual_helper = manual_helper | as_function %}
                {{ manual_helper(repeat.item) }}
              manual_cooldown_active: >-
                {% set last_ts = states(manual_helper) | as_timestamp(0) %}
                {{ last_ts > 0 and (now() | as_timestamp) - last_ts < 2 * 3600 }}
              light_target_brightness: >-
                {% set caps = {
                  'light.og_schlafzimmer_decke': 77,
                  'light.og_bad_decke': 178,
                  'light.og_flur_decke': 255,
                  'light.eg_flur_decke': 255,
                  'light.eg_arbeitszimmer_decke': 255,
                  'light.eg_wohnzimmer_decke_mitte': 102,
                  'light.eg_wohnzimmer_decke_seiten': 102
                } %}
                {% set max_brightness = caps.get(repeat.item, 255) %}
                {{ (max_brightness * target_pct_of_max | int(0) / 100) | round(0) | int }}
              brightness_delta: "{{ (light_target_brightness | int(0) - state_attr(repeat.item, 'brightness') | int(0)) | abs }}"
              night_dim_lights:
                - light.eg_arbeitszimmer_decke
                - light.og_flur_decke
                - light.og_bad_decke
          - if:
              - condition: template
                value_template: >-
                  {{
                    is_state(light_entity, 'on')
                    and not (night_override_active and light_entity in night_dim_lights)
                    and not manual_cooldown_active
                    and brightness_delta | int(0) >= 20
                  }}
            then:
              - action: light.turn_on
                target:
                  entity_id: "{{ light_entity }}"
                data:
                  brightness: "{{ light_target_brightness | int }}"

adaptive_helligkeit_nachtlicht_dimmen:
  alias: Adaptive Helligkeit Nachtlicht dimmen
  mode: parallel
  fields:
    light_entity:
      required: true
      selector:
        entity:
          domain: light
  sequence:
    - variables:
        manual_helper: >-
          {% from 'adaptive_lighting.jinja' import manual_helper %}
          {% set manual_helper = manual_helper | as_function %}
          {{ manual_helper(light_entity) }}
        manual_cooldown_active: >-
          {% set last_ts = states(manual_helper) | as_timestamp(0) %}
          {{ last_ts > 0 and (now() | as_timestamp) - last_ts < 2 * 3600 }}
    - if:
        - condition: template
          value_template: >-
            {{
              is_state(light_entity, 'on')
              and not manual_cooldown_active
            }}
      then:
        - action: light.turn_on
          target:
            entity_id: "{{ light_entity }}"
          data:
            brightness: 5

hitzeschutz_jalousien_sammel_benachrichtigen:
  alias: Hitzeschutz Jalousien gesammelt benachrichtigen
  mode: parallel
  fields:
    notification_payload:
      required: true
      selector:
        object:
  sequence:
    - variables:
        payload: "{{ notification_payload | from_json if notification_payload is string else notification_payload }}"
        summaries: "{{ payload['summaries'] }}"
        details: "{{ payload['details'] }}"
        lux: "{{ states('sensor.aussenbereich_wetterstation_helligkeit') | float(0) }}"
        outside_temp: "{{ states('sensor.aussenbereich_wetterstation_temperatur') | float(0) }}"
        azimuth: "{{ state_attr('sun.sun', 'azimuth') | float(0) }}"
        elevation: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
    - action: notify.mobile_app_torbens_iphone
      metadata: {}
      data:
        title: "Jalousien: Hitzeschutz"
        message: >-
          Hitzeschutz: {{ summaries | join(', ') }}
          {{ details | join('\n') }}

          Helligkeit: {{ lux | round(0) }} lx, aussen: {{ outside_temp | round(1) }} °C,
          Sonne: {{ elevation | round(1) }}° / {{ azimuth | round(0) }}°.
        data:
          push:
            sound:
              name: default

hitzeschutz_jalousien_checks_pruefen:
  alias: Hitzeschutz Jalousien Checks pruefen
  mode: parallel
  fields:
    checks:
      required: true
      selector:
        object:
  sequence:
    - variables:
        check_items: "{{ checks | from_json if checks is string else checks }}"
        notification_payload: >-
          {% set automatik_entity_ids = expand('group.hitzeschutz_automatik_jalousien') | map(attribute='entity_id') | list %}
          {% set upper_floor_cover_entity_ids = floor_entities('obergeschoss') | select('match', '^cover\.') | list %}
          {% set ns = namespace(summaries=[], items=[]) %}
          {% for check in check_items %}
            {% set facade_name = check.facade_name %}
            {% set facade_label = check.facade_display_name | default(facade_name, true) %}
            {% set action_id = check.action_id %}
            {% set action_text = 'schließen' if action_id == 'close' else 'öffnen' %}
            {% set action_done = 'Schließen ausgelöst' if action_id == 'close' else 'Öffnen ausgelöst' %}
            {% set action_blocked = 'Schließen nicht ausgelöst' if action_id == 'close' else 'Öffnen nicht ausgelöst' %}
            {% set cover_entity_ids = check.cover_entities if check.cover_entities is iterable and check.cover_entities is not string else [] %}
            {% set facade = namespace(items=[]) %}
            {% for cover_entity in cover_entity_ids %}
              {% set cover_name = state_attr(cover_entity, 'friendly_name') | default(cover_entity, true) %}
              {% set cover_state = states(cover_entity) %}
              {% set position = state_attr(cover_entity, 'current_position') %}
              {% set position_text = (position | round(0) | string) ~ '%' if position is number else cover_state %}
              {% set too_open = (position is number and position > 25) or (position is not number and cover_state in ['open', 'opening']) %}
              {% set too_closed = (position is number and position < 80) or (position is not number and cover_state in ['closed', 'closing']) %}
              {% set needs_change = (action_id == 'close' and too_open) or (action_id == 'open' and too_closed) %}
              {% set automation_marker_ok = not check.require_automation_marker | default(true) or cover_entity in automatik_entity_ids %}
              {% set automatik_enabled = check.allow_automation | default(true) and (not check.respect_automation_switch | default(true) or is_state('switch.hitzeschutz_og_automatik', 'on')) %}
              {% set upper_floor_open_blocked = action_id == 'open' and now().hour < 10 and cover_entity in upper_floor_cover_entity_ids %}
              {% set last_manual_ts = (state_attr('sensor.hitzeschutz_manueller_jalousie_block', 'blocked_since') | default({}, true)).get(cover_entity, '') | as_timestamp(0) %}
              {% set manual_cooldown_active = last_manual_ts > 0 and (now() | as_timestamp) - last_manual_ts < 2 * 3600 %}
              {% set manual_cooldown_ok = check.ignore_manual_cooldown | default(false) or not manual_cooldown_active %}
              {% if cover_state in ['unknown', 'unavailable'] %}
                {% set facade.items = facade.items + ['- ' ~ facade_label ~ ': ' ~ cover_name ~ ' übersprungen, nicht prüfbar (' ~ cover_state ~ ')'] %}
              {% elif needs_change %}
                {% set reasons = [] %}
                {% if not automatik_enabled %}
                  {% set reasons = reasons + ['Automatik aus'] %}
                {% endif %}
                {% if not automation_marker_ok %}
                  {% set reasons = reasons + ['nicht im Automatik-Tag'] %}
                {% endif %}
                {% if upper_floor_open_blocked %}
                  {% set reasons = reasons + ['Obergeschoss vor 10:00'] %}
                {% endif %}
                {% if not manual_cooldown_ok %}
                  {% set reasons = reasons + ['manueller Override aktiv'] %}
                {% endif %}
                {% if reasons | count == 0 %}
                  {% set facade.items = facade.items + ['- ' ~ facade_label ~ ': ' ~ cover_name ~ ' ' ~ action_done ~ ' (' ~ position_text ~ ')'] %}
                {% else %}
                  {% set facade.items = facade.items + ['- ' ~ facade_label ~ ': ' ~ cover_name ~ ' ' ~ action_blocked ~ ' (' ~ position_text ~ '), Grund: ' ~ (reasons | join(', '))] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% if facade.items | count > 0 %}
              {% set ns.summaries = ns.summaries + [facade_label ~ ' ' ~ action_text] %}
              {% set ns.items = ns.items + facade.items %}
            {% endif %}
          {% endfor %}
          {{ {'summaries': ns.summaries, 'details': ns.items} | to_json }}
    - repeat:
        for_each: "{{ check_items }}"
        sequence:
          - action: script.hitzeschutz_jalousie_fassade_pruefen
            data:
              facade_name: "{{ repeat.item.facade_name }}"
              action_id: "{{ repeat.item.action_id }}"
              cover_entities: "{{ repeat.item.cover_entities }}"
              allow_automation: "{{ repeat.item.allow_automation | default(true) }}"
              respect_automation_switch: "{{ repeat.item.respect_automation_switch | default(true) }}"
              require_automation_marker: "{{ repeat.item.require_automation_marker | default(true) }}"
              ignore_manual_cooldown: "{{ repeat.item.ignore_manual_cooldown | default(false) }}"
    - if:
        - condition: template
          value_template: "{{ (notification_payload | from_json)['details'] | count > 0 }}"
      then:
        - action: script.hitzeschutz_jalousien_sammel_benachrichtigen
          data:
            notification_payload: "{{ notification_payload }}"

hitzeschutz_jalousien_fassadenstatus_pruefen:
  alias: Hitzeschutz Jalousien Fassadenstatus pruefen
  mode: parallel
  fields:
    facade_state:
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"
    action_id:
      required: true
      selector:
        select:
          options:
            - close
            - open
    allow_automation:
      required: false
      default: false
      selector:
        boolean:
    respect_automation_switch:
      required: false
      default: true
      selector:
        boolean:
    require_automation_marker:
      required: false
      default: true
      selector:
        boolean:
    ignore_manual_cooldown:
      required: false
      default: false
      selector:
        boolean:
    use_direct_facade_calculation:
      required: false
      default: false
      selector:
        boolean:
  sequence:
    - variables:
        checks: >-
          {% from 'heat_protection.jinja' import facade_active, facade_configs %}
          {% set facade_active = facade_active | as_function %}
          {% set facade_configs = facade_configs | as_function %}
          {% set ns = namespace(checks=[]) %}
          {% for facade_key, facade in facade_configs().items() %}
            {% set direct_active = facade_active(facade_key) %}
            {% set active = direct_active if use_direct_facade_calculation | default(false) else is_state(facade.sensor, 'on') %}
            {% if (facade_state == 'on' and active) or (facade_state == 'off' and not active) %}
              {% set ns.checks = ns.checks + [{
                'facade_name': facade.name,
                'facade_display_name': facade.display_name,
                'action_id': action_id,
                'cover_entities': facade.covers,
                'allow_automation': allow_automation | default(false),
                'respect_automation_switch': respect_automation_switch | default(true),
                'require_automation_marker': require_automation_marker | default(true),
                'ignore_manual_cooldown': ignore_manual_cooldown | default(false)
              }] %}
            {% endif %}
          {% endfor %}
          {{ ns.checks | to_json }}
    - action: script.hitzeschutz_jalousien_checks_pruefen
      data:
        checks: "{{ checks }}"

hitzeschutz_manuellen_jalousie_block_zuruecksetzen:
  alias: Hitzeschutz manuellen Jalousie-Block zuruecksetzen
  mode: single
  sequence:
    - event: hitzeschutz_manual_block_reset

auto_jalousien:
  alias: Auto Jalousien
  icon: mdi:blinds-horizontal
  mode: single
  sequence:
    - action: script.hitzeschutz_manuellen_jalousie_block_zuruecksetzen
    - action: homeassistant.update_entity
      target:
        entity_id:
          - binary_sensor.hitzeschutz_fassade_west
          - binary_sensor.hitzeschutz_fassade_wohnzimmer_panorama
          - binary_sensor.hitzeschutz_sonnensegel
          - binary_sensor.hitzeschutz_fassade_ost
          - binary_sensor.hitzeschutz_fassade_sud
          - binary_sensor.hitzeschutz_fassade_nord
    - action: script.hitzeschutz_jalousien_fassadenstatus_pruefen
      data:
        facade_state: "on"
        action_id: close
        allow_automation: true
        respect_automation_switch: false
        require_automation_marker: false
        ignore_manual_cooldown: true
    - action: script.hitzeschutz_jalousien_fassadenstatus_pruefen
      data:
        facade_state: "off"
        action_id: open
        allow_automation: true
        respect_automation_switch: false
        require_automation_marker: false
        ignore_manual_cooldown: true

hitzeschutz_jalousie_fassade_pruefen:
  alias: Hitzeschutz Jalousie Fassade pruefen
  mode: parallel
  fields:
    facade_name:
      required: true
      selector:
        text:
    action_id:
      required: true
      selector:
        select:
          options:
            - close
            - open
    cover_entities:
      required: true
      selector:
        object:
    allow_automation:
      required: false
      default: true
      selector:
        boolean:
    respect_automation_switch:
      required: false
      default: true
      selector:
        boolean:
    require_automation_marker:
      required: false
      default: true
      selector:
        boolean:
    ignore_manual_cooldown:
      required: false
      default: false
      selector:
        boolean:
  sequence:
    - variables:
        action_text: "{{ 'Schliessen' if action_id == 'close' else 'Oeffnen' }}"
        cover_entity_ids: "{{ cover_entities if cover_entities is iterable and cover_entities is not string else [] }}"
        automatik_entity_ids: "{{ expand('group.hitzeschutz_automatik_jalousien') | map(attribute='entity_id') | list }}"
        upper_floor_cover_entity_ids: "{{ floor_entities('obergeschoss') | select('match', '^cover\\.') | list }}"
    - if:
        - condition: template
          value_template: "{{ cover_entity_ids | count == 0 }}"
      then:
        - action: persistent_notification.create
          data:
            title: "Hitzeschutz ohne Jalousien"
            message: "{{ action_text }} {{ facade_name }} wurde ausgeloest, aber die Fassadenliste war leer."
    - repeat:
        for_each: "{{ cover_entity_ids }}"
        sequence:
          - variables:
              cover_entity: "{{ repeat.item }}"
              cover_name: "{{ state_attr(repeat.item, 'friendly_name') | default(repeat.item, true) }}"
              cover_state: "{{ states(repeat.item) }}"
              position: "{{ state_attr(repeat.item, 'current_position') }}"
          - variables:
              current_text: >-
                {% if position is number %}
                {{ position | round(0) }}%
                {% else %}
                {{ cover_state }}
                {% endif %}
              too_open: "{{ (position is number and position > 25) or (position is not number and cover_state in ['open', 'opening']) }}"
              too_closed: "{{ (position is number and position < 80) or (position is not number and cover_state in ['closed', 'closing']) }}"
          - variables:
              needs_change: "{{ (action_id == 'close' and too_open) or (action_id == 'open' and too_closed) }}"
              automatik_marked: "{{ repeat.item in automatik_entity_ids }}"
              automatik_enabled: "{{ allow_automation | default(true) and (not respect_automation_switch | default(true) or is_state('switch.hitzeschutz_og_automatik', 'on')) }}"
              upper_floor_open_blocked: "{{ action_id == 'open' and now().hour < 10 and repeat.item in upper_floor_cover_entity_ids }}"
              automation_marker_ok: "{{ not require_automation_marker | default(true) or automatik_marked }}"
              cover_manual_cooldown_active: >-
                {% set last_ts = (state_attr('sensor.hitzeschutz_manueller_jalousie_block', 'blocked_since') | default({}, true)).get(repeat.item, '') | as_timestamp(0) %}
                {{ last_ts > 0 and (now() | as_timestamp) - last_ts < 2 * 3600 }}
              manual_cooldown_ok: "{{ ignore_manual_cooldown | default(false) or not cover_manual_cooldown_active }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ cover_state in ['unknown', 'unavailable'] }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      title: "Hitzeschutz: Jalousie nicht pruefbar"
                      message: "{{ cover_entity }} ist {{ cover_state }} und wurde fuer {{ action_text }} {{ facade_name }} uebersprungen."
              - conditions:
                  - condition: template
                    value_template: "{{ needs_change and automation_marker_ok and automatik_enabled and not upper_floor_open_blocked and manual_cooldown_ok }}"
                sequence:
                  - action: script.hitzeschutz_jalousie_automatisieren
                    data:
                      cover_entity: "{{ cover_entity }}"
                      action_id: "{{ action_id }}"
