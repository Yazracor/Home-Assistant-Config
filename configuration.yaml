
# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  packages: !include_dir_named virtual
  customize:
    switch.licht:
      friendly_name: TTR 57 Entfeuchter
    sensor.licht_power:
      friendly_name: TTR 57 Entfeuchter Leistung
    sensor.licht_energy:
      friendly_name: TTR 57 Entfeuchter Energie
    sensor.licht_energy_returned:
      friendly_name: TTR 57 Entfeuchter Rueckgespeiste Energie
    binary_sensor.licht_overheating:
      friendly_name: TTR 57 Entfeuchter Ueberhitzung
    binary_sensor.licht_overpowering:
      friendly_name: TTR 57 Entfeuchter Ueberleistung
    binary_sensor.licht_overvoltage:
      friendly_name: TTR 57 Entfeuchter Ueberspannung
    binary_sensor.licht_overcurrent:
      friendly_name: TTR 57 Entfeuchter Ueberstrom

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
group: !include groups.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include templates.yaml

shell_command:
  git_snapshot: /bin/sh /config/git-snapshot.sh

# KNX entities converted from FHEM/ETS
knx: !include knx.yaml
