# Automatisch aus fhem.cfg und KNX.xml erzeugt.
# Quelle: FHEM-KNX-Konfiguration; Namen entsprechen den FHEM-Device-Namen.
# Datei: knx/sensors.yaml

# ETS: Messwert Dämmerung
# state_address: 1/1/2 -> Messwert Dämmerung | Zentralfunktionen > Wetterstation
- name: "Wetterstation Dämmerung"
  state_address: "1/1/2"
  type: "illuminance"

# ETS: Messwert Helligkeit 1
# state_address: 1/1/3 -> Messwert Helligkeit 1 | Zentralfunktionen > Wetterstation
- name: "Wetterstation Helligkeit"
  state_address: "1/1/3"
  type: "illuminance"
  sync_state: true

# ETS: Messwert Temperatur
# state_address: 1/1/4 -> Messwert Temperatur | Zentralfunktionen > Wetterstation
- name: "Wetterstation Temperatur"
  state_address: "1/1/4"
  type: "temperature"
  sync_state: true

# ETS: Messwert Wind
# state_address: 1/1/1 -> Messwert Wind | Zentralfunktionen > Wetterstation
- name: "Wetterstation Wind"
  state_address: "1/1/1"
  type: "wind_speed_ms"
  sync_state: true
