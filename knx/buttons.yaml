# Automatisch aus fhem.cfg und KNX.xml erzeugt.
# Quelle: FHEM-KNX-Konfiguration; Namen entsprechen den FHEM-Device-Namen.
# Datei: knx/buttons.yaml

# FHEM: Garagentuer
# FHEM room: Garage,homebridge
# address: 2/3/14 -> Garagentor Öffner/Schließer | Schalten > Aussen/Garage
# HINWEIS: Garagentor-Fahrt als KNX button; Status separat als binary_sensor.
- name: "Garagentor Impuls"
  address: "2/3/14"
  payload: 1

# FHEM: KNX_Esszimmer.Tisch_knx
# address: 6/4/10 -> Esstisch Dimmen Funk | Eldat Funk > Funktionen
# HINWEIS: Funk-/Tasterfunktion ohne Statusrückmeldung; bewusst als HA button abgebildet.
- name: "Esstisch Taster KNX"
  address: "6/4/10"
  payload: 1
