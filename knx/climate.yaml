# Automatisch aus fhem.cfg und KNX.xml erzeugt.
# Quelle: FHEM-KNX-Konfiguration; Namen entsprechen den FHEM-Device-Namen.
# Datei: knx/climate.yaml

# FHEM: TH_EG_Buero
# FHEM room: Buero,KNX,homebridge
# target_temperature_address: 5/0/75 -> --1A6 EG Gast Basis Sollwert | Heizung > EG / OG
# temperature_address: 5/0/79 -> EG Gast Ist-Temp | Heizung > EG / OG
# target_temperature_state_address: 5/0/81 -> EG Gast Soll-Temp | Heizung > EG / OG
# active_state_address: 5/0/77, 5/0/80 -> EG Gast Meldung Heizen/Kühlen | Heizung > EG / OG
# command_value_state_address: 5/0/82 -> EG Gast Stellgröße Heizen/Kühlen | Heizung > EG / OG
# HINWEIS: Heizen/Kühlen-Umschaltung (5/0/76) erfolgt zentral und wird hier nicht bedient.
# HINWEIS: Gira Tastsensor 3 Plus: Meldung Heizen/Kühlen sind 1-Bit-Energieanforderungen (1 = Anforderung, 0 = keine).
- name: "Thermostat"
  temperature_address: "5/0/79"
  target_temperature_address: "5/0/75"
  target_temperature_state_address: "5/0/81"
  active_state_address:
    - "5/0/77"
    - "5/0/80"
  command_value_state_address: "5/0/82"
  controller_modes:
    - "auto"
  default_controller_mode: "auto"
  min_temp: 7.0
  max_temp: 32.0
