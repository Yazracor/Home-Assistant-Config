# Automatisch aus fhem.cfg und KNX.xml erzeugt.
# Quelle: FHEM-KNX-Konfiguration und ETS-Gruppenadressen.
# Datei: knx/climate.yaml

# HINWEIS: Heizen/Kühlen-Umschaltung erfolgt zentral und wird hier nicht bedient.
# HINWEIS: Gira Tastsensor 3 Plus: Meldung Heizen/Kühlen sind 1-Bit-Energieanforderungen (1 = Anforderung, 0 = keine).
# HINWEIS: Home Assistant liest den zentralen 1-Bit-Heizen/Kuehlen-Status als heat_cool_state_address.
# HINWEIS: ETS-Betriebsmodiumschaltung ist nicht als HA controller_mode_state_address geeignet.
# HINWEIS: Gira Solltemperaturvorgabe erfolgt über das Soll-Temp-Objekt des aktiven Betriebsmodus,
# nicht über den Basis-Sollwert.

# ETS: --1A1 OG Schlafz. Basis Sollwert
- name: "Schlafzimmer Thermostat"
  temperature_address: "5/0/4"
  target_temperature_address: "5/0/6"
  target_temperature_state_address: "5/0/6"
  active_state_address:
    - "5/0/2"
    - "5/0/5"
  command_value_state_address: "5/0/9"
  heat_cool_state_address: "1/4/1"
  min_temp: 7.0
  max_temp: 32.0

