# garage_cover.yaml
#
# Virtuelles Garagentor-Cover für ein KNX-Tor mit:
# - einem Impuls-Schalter (öffnen / stoppen / schließen)
# - einer Status-Rückmeldung (offen / geschlossen)
#
# Entity-Namen ggf. anpassen:
#   switch.garagentor
#   binary_sensor.garagentor_status

script:
  garagentor_impuls:
    alias: Garagentor Impuls
    sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.garagentor
      - delay: "00:00:01"
      - action: switch.turn_off
        target:
          entity_id: switch.garagentor

template:
  - cover:
      - name: "Garagentor"
        unique_id: knx_garagentor_virtual_cover
        device_class: garage

        state: >
          {% if is_state('binary_sensor.garagentor_status', 'on') %}
            open
          {% elif is_state('binary_sensor.garagentor_status', 'off') %}
            closed
          {% else %}
            unknown
          {% endif %}

        open_cover:
          - action: script.garagentor_impuls

        close_cover:
          - action: script.garagentor_impuls

        stop_cover:
          - action: script.garagentor_impuls
