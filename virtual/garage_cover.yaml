script:
  garagentuer_impuls:
    alias: Garagentür Impuls
    sequence:
      - action: button.press
        target:
          entity_id: button.garagentuer

template:
  - cover:
      - name: "Garagentür"
        unique_id: knx_garagentuer_virtual_cover
        device_class: garage

        state: >
          {% if is_state('binary_sensor.garagentuer_currentdoorstate', 'on') %}
            open
          {% elif is_state('binary_sensor.garagentuer_currentdoorstate', 'off') %}
            closed
          {% else %}
            unknown
          {% endif %}

        open_cover:
          - action: script.garagentuer_impuls

        close_cover:
          - action: script.garagentuer_impuls

        stop_cover:
          - action: script.garagentuer_impuls
