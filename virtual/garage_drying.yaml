input_boolean:
  garage_entfeuchtung_warnung_aktiv:
    name: "Garage Entfeuchtung Warnung aktiv"
    icon: mdi:alert-circle-outline

input_number:
  garage_entfeuchtung_startfeuchte:
    name: "Garage Entfeuchtung Startfeuchte"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:water-percent
  garage_entfeuchtung_boost_startfeuchte:
    name: "Garage Entfeuchtung Boost Startfeuchte"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:water-percent
template:
  - sensor:
      - name: "Sonoff SNZB-02WD Temperatur Eingangsbereich"
        unique_id: sonoff_snzb_02wd_temperature_entrance
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        availability: >-
          {{ states('sensor.sonoff_snzb_02wd_temperature') not in ['unknown', 'unavailable'] }}
        state: "{{ states('sensor.sonoff_snzb_02wd_temperature') | float | round(1) }}"
        attributes:
          source: sensor.sonoff_snzb_02wd_temperature

      - name: "Garage Aussenluft Feuchte bei Garagentemperatur"
        unique_id: garage_outside_air_humidity_at_garage_temperature
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        availability: >-
          {{
            is_number(states('sensor.sonoff_snzb_02wd_feuchte_korrigiert'))
            and is_number(state_attr('sensor.sonoff_snzb_02wd_feuchte_korrigiert', 'raw_temperature'))
            and is_number(states('sensor.wifi_smart_switch_temperature'))
          }}
        state: >-
          {% set humidity = states('sensor.sonoff_snzb_02wd_feuchte_korrigiert') | float(0) %}
          {% set outside = state_attr('sensor.sonoff_snzb_02wd_feuchte_korrigiert', 'raw_temperature') | float(0) %}
          {% set garage = states('sensor.wifi_smart_switch_temperature') | float(0) %}
          {% set projected = humidity * (2.718281828459045 ** (17.62 * outside / (243.12 + outside) - 17.62 * garage / (243.12 + garage))) %}
          {{ ([0, [100, projected] | min] | max) | round(1) }}

  # Preserve the existing correction sensor's name and unique_id / entity registry entry.
  - triggers:
      - trigger: time_pattern
        minutes: "/2"
        id: sample
      - trigger: state
        entity_id:
          - sensor.sonoff_snzb_02wd_humidity
          - sensor.sonoff_snzb_02wd_temperature
        to: null
        id: source
      - trigger: homeassistant
        event: start
        id: reset
      - trigger: event
        event_type: event_template_reloaded
        id: reset
    variables:
      correction: >-
        {% from 'sonoff_humidity.jinja' import humidity_correction %}
        {% set reset = trigger.id == 'reset'
          or states('sensor.sonoff_snzb_02wd_feuchte_korrigiert') in ['unknown', 'unavailable']
          or (trigger.id == 'source' and (trigger.from_state is none or not is_number(trigger.from_state.state))) %}
        {{ (humidity_correction | as_function)(
          state_attr('sensor.sonoff_snzb_02wd_feuchte_korrigiert', 'samples'),
          reset, trigger.id == 'sample', as_timestamp(now()),
          states('sensor.sonoff_snzb_02wd_temperature'),
          states('sensor.sonoff_snzb_02wd_humidity')) }}
    sensor:
      - name: "Sonoff SNZB-02WD Feuchte korrigiert"
        unique_id: sonoff_snzb_02wd_humidity_corrected
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        availability: "{{ correction.value is not none }}"
        state: "{{ correction.value }}"
        attributes:
          raw_value: "{{ states('sensor.sonoff_snzb_02wd_humidity') }}"
          raw_temperature: "{{ states('sensor.sonoff_snzb_02wd_temperature') }}"
          correction_mode: "{{ correction.mode }}"
          humidity_change_per_hour: "{{ correction.humidity_rate }}"
          temperature_change_per_hour: "{{ correction.temperature_rate }}"
          samples: "{{ correction.samples }}"

  - binary_sensor:
      - name: "Garage Feuchte ueber 58"
        unique_id: garage_feuchte_ueber_58
        device_class: moisture
        availability: "{{ is_number(states('sensor.wifi_smart_switch_humidity')) }}"
        state: "{{ states('sensor.wifi_smart_switch_humidity') | float(0) > 58 }}"
      - name: "Garage Feuchte ueber 60"
        unique_id: garage_feuchte_ueber_60
        device_class: moisture
        state: "{{ states('sensor.wifi_smart_switch_humidity') | float(0) > 60 }}"
      # Keep unique_id stable for existing HomeKit/entity-registry mappings.
      - name: "Garage Feuchte ueber 63"
        unique_id: garage_feuchte_ueber_65
        device_class: moisture
        state: "{{ states('sensor.wifi_smart_switch_humidity') | float(0) > 63 }}"
      - name: "Garage Feuchte unter 55"
        unique_id: garage_feuchte_unter_55
        device_class: moisture
        state: "{{ states('sensor.wifi_smart_switch_humidity') | float(999) < 55 }}"
      - name: "Garage Feuchte unter 58"
        unique_id: garage_feuchte_unter_58
        device_class: moisture
        state: "{{ states('sensor.wifi_smart_switch_humidity') | float(999) < 58 }}"
      - name: "Garage Feuchte bis 59"
        unique_id: garage_feuchte_unter_60
        device_class: moisture
        state: "{{ states('sensor.wifi_smart_switch_humidity') | float(999) <= 59 }}"
      - name: "Garage Temperatur unter 5"
        unique_id: garage_temperatur_unter_5
        device_class: cold
        state: "{{ states('sensor.wifi_smart_switch_temperature') | float(99) < 5 }}"
      - name: "Garage Temperatur ueber 13"
        unique_id: garage_temperatur_ueber_13
        device_class: heat
        state: "{{ states('sensor.wifi_smart_switch_temperature') | float(-99) > 13 }}"
      - name: "Garage TTK Leistung unter 100"
        unique_id: garage_ttk_leistung_unter_100
        device_class: problem
        availability: >-
          {{ states('sensor.entfeuchter_power') not in ['unknown', 'unavailable'] }}
        state: >-
          {{
            is_state('switch.entfeuchter', 'on')
            and states('sensor.entfeuchter_power') | float(0) < 100
          }}
