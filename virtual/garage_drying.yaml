input_boolean:
  garage_entfeuchtung_warnung_aktiv:
    name: "Garage Entfeuchtung Warnung aktiv"
    icon: mdi:alert-circle-outline

input_number:
  garage_entfeuchtung_startfeuchte:
    name: "Garage Entfeuchtung Startfeuchte"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:water-percent
  garage_entfeuchtung_boost_startfeuchte:
    name: "Garage Entfeuchtung Boost Startfeuchte"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:water-percent
template:
  - sensor:
      - name: "Sonoff SNZB-02WD Temperatur Eingangsbereich"
        unique_id: sonoff_snzb_02wd_temperature_entrance
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        availability: >-
          {{ states('sensor.sonoff_snzb_02wd_temperature') not in ['unknown', 'unavailable'] }}
        state: "{{ states('sensor.sonoff_snzb_02wd_temperature') | float | round(1) }}"
        attributes:
          source: sensor.sonoff_snzb_02wd_temperature

      - name: "Sonoff SNZB-02WD Feuchte korrigiert"
        unique_id: sonoff_snzb_02wd_humidity_corrected
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        availability: >-
          {{
            states('sensor.sonoff_snzb_02wd_humidity') not in ['unknown', 'unavailable']
            and states('sensor.sonoff_snzb_02wd_temperature') not in ['unknown', 'unavailable']
          }}
        state: >-
          {% set temperature = states('sensor.sonoff_snzb_02wd_temperature') | float %}
          {% set relative_humidity = states('sensor.sonoff_snzb_02wd_humidity') | float %}
          {% set saturation_pressure = 6.112 * (2.718281828459045 ** ((17.62 * temperature) / (243.12 + temperature))) %}
          {% set vapor_pressure = relative_humidity / 100 * saturation_pressure %}
          {% set absolute_humidity = 216.7 * vapor_pressure / (273.15 + temperature) %}
          {% set corrected_absolute_humidity = 4.42081 + 0.66924 * absolute_humidity %}
          {% set corrected_relative_humidity = 100 * corrected_absolute_humidity * (273.15 + temperature) / (216.7 * saturation_pressure) %}
          {{ [0, [100, corrected_relative_humidity] | min] | max | round(1) }}
        attributes:
          raw_value: "{{ states('sensor.sonoff_snzb_02wd_humidity') }}"
          raw_temperature: "{{ states('sensor.sonoff_snzb_02wd_temperature') }}"
          absolute_humidity_fit: "4.42081 + 0.66924 * absolute_humidity"
          absolute_humidity: >-
            {% set temperature = states('sensor.sonoff_snzb_02wd_temperature') | float %}
            {% set relative_humidity = states('sensor.sonoff_snzb_02wd_humidity') | float %}
            {% set saturation_pressure = 6.112 * (2.718281828459045 ** ((17.62 * temperature) / (243.12 + temperature))) %}
            {% set vapor_pressure = relative_humidity / 100 * saturation_pressure %}
            {{ (216.7 * vapor_pressure / (273.15 + temperature)) | round(2) }}
          corrected_absolute_humidity: >-
            {% set temperature = states('sensor.sonoff_snzb_02wd_temperature') | float %}
            {% set relative_humidity = states('sensor.sonoff_snzb_02wd_humidity') | float %}
            {% set saturation_pressure = 6.112 * (2.718281828459045 ** ((17.62 * temperature) / (243.12 + temperature))) %}
            {% set vapor_pressure = relative_humidity / 100 * saturation_pressure %}
            {% set absolute_humidity = 216.7 * vapor_pressure / (273.15 + temperature) %}
            {{ (4.42081 + 0.66924 * absolute_humidity) | round(2) }}

  - binary_sensor:
      - name: "Garage Feuchte ueber 60"
        unique_id: garage_feuchte_ueber_60
        device_class: moisture
        state: "{{ states('sensor.wifi_smart_switch_humidity') | float(0) > 60 }}"
      # Keep unique_id stable for existing HomeKit/entity-registry mappings.
      - name: "Garage Feuchte ueber 63"
        unique_id: garage_feuchte_ueber_65
        device_class: moisture
        state: "{{ states('sensor.wifi_smart_switch_humidity') | float(0) > 63 }}"
      - name: "Garage Feuchte unter 55"
        unique_id: garage_feuchte_unter_55
        device_class: moisture
        state: "{{ states('sensor.wifi_smart_switch_humidity') | float(999) < 55 }}"
      - name: "Garage Feuchte unter 58"
        unique_id: garage_feuchte_unter_58
        device_class: moisture
        state: "{{ states('sensor.wifi_smart_switch_humidity') | float(999) < 58 }}"
      - name: "Garage Feuchte bis 59"
        unique_id: garage_feuchte_unter_60
        device_class: moisture
        state: "{{ states('sensor.wifi_smart_switch_humidity') | float(999) <= 59 }}"
      - name: "Garage Temperatur unter 5"
        unique_id: garage_temperatur_unter_5
        device_class: cold
        state: "{{ states('sensor.wifi_smart_switch_temperature') | float(99) < 5 }}"
      - name: "Garage Temperatur ueber 13"
        unique_id: garage_temperatur_ueber_13
        device_class: heat
        state: "{{ states('sensor.wifi_smart_switch_temperature') | float(-99) > 13 }}"
      - name: "Garage TTK Leistung unter 100"
        unique_id: garage_ttk_leistung_unter_100
        device_class: problem
        availability: >-
          {{ states('sensor.entfeuchter_power') not in ['unknown', 'unavailable'] }}
        state: >-
          {{
            is_state('switch.entfeuchter', 'on')
            and states('sensor.entfeuchter_power') | float(0) < 100
          }}
