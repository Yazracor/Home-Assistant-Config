input_boolean:
  hitzeschutz_og_automatik_aktiv:
    name: "Intern Hitzeschutz OG Automatik"
    icon: mdi:blinds
    initial: true
  hitzeschutz_automatik_fahrbefehl_aktiv:
    name: "Intern Hitzeschutz Automatik Fahrbefehl"
    icon: mdi:blinds-horizontal
    initial: false

template:
  - switch:
      - name: "Hitzeschutz OG Automatik"
        unique_id: hitzeschutz_og_automatik_homekit_switch
        icon: mdi:blinds
        state: "{{ is_state('input_boolean.hitzeschutz_og_automatik_aktiv', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.hitzeschutz_og_automatik_aktiv
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.hitzeschutz_og_automatik_aktiv
