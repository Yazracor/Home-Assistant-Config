template:
  - sensor:
      - <<: &energy_request_defaults
          name: "Energieanforderung"
          state: >-
            {% from 'climate_status.jinja' import energy_request %}
            {% set energy_request = energy_request | as_function %}
            {{ energy_request(room) }}
          icon: >-
            {% from 'climate_status.jinja' import energy_icon %}
            {% set energy_icon = energy_icon | as_function %}
            {{ energy_icon(room) }}
        unique_id: og_schlafzimmer_energieanforderung
        variables:
          room: og_schlafzimmer

      - <<: *energy_request_defaults
        unique_id: og_bad_energieanforderung
        variables:
          room: og_bad

      - <<: *energy_request_defaults
        unique_id: og_buro_energieanforderung
        variables:
          room: og_buro

      - <<: *energy_request_defaults
        unique_id: og_ankleide_energieanforderung
        variables:
          room: og_ankleide

      - <<: *energy_request_defaults
        unique_id: eg_flur_energieanforderung
        variables:
          room: eg_flur

      - <<: *energy_request_defaults
        unique_id: eg_arbeitszimmer_energieanforderung
        variables:
          room: eg_arbeitszimmer

      - <<: *energy_request_defaults
        unique_id: eg_arbeitszimmer_flur_energieanforderung
        variables:
          room: eg_arbeitszimmer_flur

      - <<: *energy_request_defaults
        unique_id: eg_gaestebad_energieanforderung
        variables:
          room: eg_gaestebad

      - <<: *energy_request_defaults
        unique_id: eg_gaeste_wc_energieanforderung
        variables:
          room: eg_gaeste_wc

      - <<: *energy_request_defaults
        unique_id: eg_garderobe_energieanforderung
        variables:
          room: eg_garderobe

      - <<: *energy_request_defaults
        unique_id: eg_technik_energieanforderung
        variables:
          room: eg_technik

      - <<: *energy_request_defaults
        unique_id: eg_kueche_energieanforderung
        variables:
          room: eg_kueche

      - <<: *energy_request_defaults
        unique_id: eg_wohnzimmer_energieanforderung
        variables:
          room: eg_wohnzimmer

      - <<: *energy_request_defaults
        unique_id: kg_flur_energieanforderung
        variables:
          room: kg_flur

      - <<: *energy_request_defaults
        unique_id: kg_gast_hobby_energieanforderung
        variables:
          room: kg_gast_hobby

      - <<: *energy_request_defaults
        unique_id: kg_kinderbad_energieanforderung
        variables:
          room: kg_kinderbad

      - <<: *energy_request_defaults
        unique_id: kg_zimmer_sinja_energieanforderung
        variables:
          room: kg_zimmer_sinja

      - <<: *energy_request_defaults
        unique_id: kg_zimmer_silas_energieanforderung
        variables:
          room: kg_zimmer_silas

  - binary_sensor:
      - name: "Thermostate Zentralumschaltung OK"
        unique_id: thermostate_zentralumschaltung_ok
        availability: "{{ states('binary_sensor.heizen_kuehlen_rueckmeldung') in ['on', 'off'] }}"
        state: >-
          {% from 'climate_status.jinja' import central_switching_ok %}
          {% set central_switching_ok = central_switching_ok | as_function %}
          {{ central_switching_ok() }}
        attributes:
          erwarteter_modus: >-
            {% from 'climate_status.jinja' import expected_mode_label %}
            {% set expected_mode_label = expected_mode_label | as_function %}
            {{ expected_mode_label() }}
          abweichende_thermostate: >-
            {% from 'climate_status.jinja' import deviating_thermostats %}
            {% set deviating_thermostats = deviating_thermostats | as_function %}
            {{ deviating_thermostats() }}
