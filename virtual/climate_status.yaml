template:
  - sensor:
      - name: "Energieanforderung"
        unique_id: og_schlafzimmer_energieanforderung
        state: >
          {% set heat = states('binary_sensor.og_schlafzimmer_anforderung_heizen') %}
          {% set cool = states('binary_sensor.og_schlafzimmer_anforderung_kuhlen') %}
          {% set heat_cool = states('binary_sensor.heizen_kuehlen_rueckmeldung') %}
          {% if heat_cool == 'off' and cool == 'on' %}
            kuehlen
          {% elif heat_cool == 'on' and heat == 'on' %}
            heizen
          {% elif cool == 'on' and heat != 'on' %}
            kuehlen
          {% elif heat == 'on' and cool != 'on' %}
            heizen
          {% elif heat == 'off' and cool == 'off' %}
            keine
          {% else %}
            unbekannt
          {% endif %}
        icon: >
          {% set heat = states('binary_sensor.og_schlafzimmer_anforderung_heizen') %}
          {% set cool = states('binary_sensor.og_schlafzimmer_anforderung_kuhlen') %}
          {% set heat_cool = states('binary_sensor.heizen_kuehlen_rueckmeldung') %}
          {% if heat_cool == 'off' and cool == 'on' %}
            mdi:snowflake
          {% elif heat_cool == 'on' and heat == 'on' %}
            mdi:fire
          {% elif cool == 'on' and heat != 'on' %}
            mdi:snowflake
          {% elif heat == 'on' and cool != 'on' %}
            mdi:fire
          {% else %}
            mdi:thermostat
          {% endif %}

