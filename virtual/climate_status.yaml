template:
  - sensor:
      - name: "Energieanforderung"
        unique_id: arbeitszimmer_energieanforderung
        state: >
          {% set heat = states('binary_sensor.arbeitszimmer_eg_anforderung_heizen') %}
          {% if heat not in ['on', 'off'] %}
            {% set heat = states('binary_sensor.arbeitszimmer_anforderung_heizen') %}
          {% endif %}
          {% if heat not in ['on', 'off'] %}
            {% set heat = states('binary_sensor.anforderung_heizen') %}
          {% endif %}
          {% set cool = states('binary_sensor.arbeitszimmer_eg_anforderung_kuhlen') %}
          {% if cool not in ['on', 'off'] %}
            {% set cool = states('binary_sensor.arbeitszimmer_anforderung_kuhlen') %}
          {% endif %}
          {% if cool not in ['on', 'off'] %}
            {% set cool = states('binary_sensor.anforderung_kuhlen') %}
          {% endif %}
          {% if heat == 'on' %}
            heizen
          {% elif cool == 'on' %}
            kuehlen
          {% elif heat == 'off' and cool == 'off' %}
            keine
          {% else %}
            unbekannt
          {% endif %}
        icon: >
          {% set heat = states('binary_sensor.arbeitszimmer_eg_anforderung_heizen') %}
          {% if heat not in ['on', 'off'] %}
            {% set heat = states('binary_sensor.arbeitszimmer_anforderung_heizen') %}
          {% endif %}
          {% if heat not in ['on', 'off'] %}
            {% set heat = states('binary_sensor.anforderung_heizen') %}
          {% endif %}
          {% set cool = states('binary_sensor.arbeitszimmer_eg_anforderung_kuhlen') %}
          {% if cool not in ['on', 'off'] %}
            {% set cool = states('binary_sensor.arbeitszimmer_anforderung_kuhlen') %}
          {% endif %}
          {% if cool not in ['on', 'off'] %}
            {% set cool = states('binary_sensor.anforderung_kuhlen') %}
          {% endif %}
          {% if heat == 'on' %}
            mdi:fire
          {% elif cool == 'on' %}
            mdi:snowflake
          {% else %}
            mdi:thermostat
          {% endif %}
