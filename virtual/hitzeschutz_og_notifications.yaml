input_boolean:
  hitzeschutz_og_automatik_aktiv:
    name: "Intern Hitzeschutz OG Automatik"
    icon: mdi:blinds
    initial: true

template:
  - switch:
      - name: "Hitzeschutz OG Automatik"
        unique_id: hitzeschutz_og_automatik_homekit_switch
        icon: mdi:blinds
        state: "{{ is_state('input_boolean.hitzeschutz_og_automatik_aktiv', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.hitzeschutz_og_automatik_aktiv
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.hitzeschutz_og_automatik_aktiv
      - name: "Hitzeschutz Jalousien anwenden"
        unique_id: hitzeschutz_jalousien_anwenden_homekit_switch
        icon: mdi:blinds-horizontal
        state: "{{ false }}"
        turn_on:
          - action: script.hitzeschutz_jalousien_regeln_anwenden
        turn_off: []
