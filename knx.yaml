# KNX-Entitäten aus FHEM/ETS-Migration.
# Diese Datei wird in configuration.yaml per `knx: !include knx.yaml` eingebunden.
light: !include knx/lights.yaml
cover: !include knx/covers.yaml
climate: !include knx/climate.yaml
binary_sensor: !include knx/binary_sensors.yaml
sensor: !include knx/sensors.yaml
weather: !include knx/weather.yaml
button: !include knx/buttons.yaml
expose:
  - type: binary
    entity_id: binary_sensor.wetterstation_tag
    address: "1/1/14"
    default: false
    periodic_send:
      minutes: 5
event:
  - address:
      - "1/4/1"
      - "2/0/*"
      - "2/1/*"
      - "2/2/*"
      - "3/0/*"
      - "3/1/*"
      - "4/0/*"
      - "4/1/*"
      - "4/2/*"
      - "5/0/75"
      - "5/0/79"
      - "5/0/81"
